[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyn-csa-experiment"
version = "0.0.0"
description = "Controlled WikiText-103 study of compressed-block sparse attention"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["sparse-attention", "reproducibility", "language-modeling", "wikitext-103"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.8,<3",
  "numpy>=2.0,<3",
  "tokenizers>=0.20,<1",
  "datasets>=3.0,<6",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
# Packaging/check tooling only; the runtime closure is requirements.lock.
dev = ["build>=1.2,<2"]

# The measurement library is a package (`explib`) with thin top-level shims for
# the historical script entry points.  Declare both explicitly: setuptools'
# automatic discovery would otherwise walk result/cache directories and fail
# with "Multiple top-level packages discovered".  The test entry points stay
# source-only.  `test_project_packaging_is_complete` fails if a new top-level
# module or split package is added without being listed here.
[tool.setuptools]
py-modules = [
  "archive_release",
  "audit_gates",
  "baseline_tune",
  "build_report",
  "csa_kernels",
  "data_guard",
  "error_analysis",
  "exp_lib",
  "fuse_analysis",
  "par",
  "run_gapfill",
]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = [
  "explib*",
  "_audit_gates*",
  "_build_report*",
  "_csa_kernels*",
  "_data_guard*",
]

[tool.setuptools.package-data]
"*" = ["_parts/*.py", "methodology_steps/*.py"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
