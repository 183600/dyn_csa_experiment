name: dsh-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DeepSeek Harness
        run: |
          npm i -g @deepseek-ai/dsh@0.2.1-rc.2
          dsh --version
      - name: Smoke test (real API call)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          [ -n "$DEEPSEEK_API_KEY" ] || { echo "missing key"; exit 1; }
          timeout 420 dsh --profile headless "只回复两个字：OK" | tee /tmp/answer.txt
          grep -q "OK" /tmp/answer.txt
