name: CPU tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: cpu-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt
            pyproject.toml
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run CPU test suite
        run: python test_review_fixes.py
      - name: Zero-GPU frozen-plan preflight (no test read)
        run: python v12_supp.py plan
