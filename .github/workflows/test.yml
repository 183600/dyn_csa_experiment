name: CPU tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: cpu-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install tokenizers datasets matplotlib
      - name: Run CPU test suite
        run: python test_review_fixes.py
