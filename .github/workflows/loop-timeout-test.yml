name: loop-timeout-test
on:
  workflow_dispatch:
jobs:
  work-timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: hang past the job timeout
        run: sleep 240
  after-timeout:
    needs: [work-timeout]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: report
        run: echo "RAN-AFTER-JOB-TIMEOUT"
