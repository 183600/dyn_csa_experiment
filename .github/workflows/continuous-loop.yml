name: Continuous Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: continuous-loop
  cancel-in-progress: false

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    # 保留 job 级超时作为兜底（GitHub Actions 单 job 硬上限 6 小时）
    # 如果想完全不设限，可以删除这一行，但 6 小时后 job 会被平台强制终止
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space (keep miniconda)
        run: |
          set +e
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after cleanup ==="
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure swap (safe version)
        run: |
          set -e
          echo "=== Before ==="
          free -h
          df -h /
          sudo systemctl disable --now systemd-oomd.socket systemd-oomd.service 2>/dev/null || true
          sudo modprobe zram 2>/dev/null || true
          if [ -e /dev/zram0 ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (8G, prio=100)" \
              || echo "[warn] zram enable failed"
          else
            echo "[info] zram not available, skip"
          fi
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_MB=$((AVAIL_KB / 1024))
          WANT_MB=$((AVAIL_MB - 3072))
          if [ "$WANT_MB" -gt 8192 ]; then WANT_MB=8192; fi
          if [ "$WANT_MB" -lt 2048 ]; then WANT_MB=2048; fi
          echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
            echo "[info] fallocate failed, falling back to dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=none
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"
          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=200
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.dirty_ratio=40
          sudo sysctl -w vm.dirty_background_ratio=10
          sudo sysctl -w vm.watermark_scale_factor=200 2>/dev/null || true
          echo "=== After ==="
          free -h
          swapon --show
          df -h /

      - name: Install opencode
        run: npm i -g opencode-ai

      # 模板里的 __MODEL__ 会在运行时被实际探测到的模型 id 替换
      # 注意：文件名不要以 opencode 开头，避免被 opencode 当成配置误读
      - name: Prepare opencode config templates
        run: |
          mkdir -p ~/.config/opencode

          cat > ~/.config/opencode/template.nvidia.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA",
                "options": {
                  "baseURL": "https://integrate.api.nvidia.com/v1",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "__MODEL__": { "name": "__MODEL__" }
                }
              }
            },
            "model": "nvidia/__MODEL__"
          }
          EOF

          cat > ~/.config/opencode/template.moonshot.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "moonshot": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Moonshot",
                "options": {
                  "baseURL": "https://api.moonshot.cn/v1",
                  "apiKey": "{env:KIMI_API_KEY}"
                },
                "models": {
                  "__MODEL__": { "name": "__MODEL__" }
                }
              }
            },
            "model": "moonshot/__MODEL__"
          }
          EOF

          # 初始配置（运行循环里每轮都会按探测结果重新生成）
          sed 's|__MODEL__|moonshotai/kimi-k3|g' ~/.config/opencode/template.nvidia.json \
            > ~/.config/opencode/opencode.json

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 修改点：删除了本步骤的 timeout-minutes: 300，
      # 单次 opencode 运行不再有 5 小时的限制，
      # 循环会一直跑到 job 级超时（330 分钟）为止
      - name: Run opencode continuously
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -uo pipefail

          LOOP=0
          while true; do
            LOOP=$((LOOP + 1))
            echo "=========================================="
            echo "[loop] iteration #${LOOP} start at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "=========================================="

            # ---------- 1. 探测可用 provider 与模型 ----------
            PROVIDER=""
            MODEL_ID=""

            if [ -n "${NVIDIA_API_KEY:-}" ]; then
              MODEL_ID=$(curl -sf --max-time 30 \
                -H "Authorization: Bearer ${NVIDIA_API_KEY}" \
                https://integrate.api.nvidia.com/v1/models \
                | jq -r '.data[].id' 2>/dev/null \
                | grep -Ei 'qwen|kimi|deepseek' | head -n 1 || true)
              if [ -n "${MODEL_ID}" ]; then
                PROVIDER="nvidia"
              fi
            fi

            if [ -z "${PROVIDER}" ] && [ -n "${KIMI_API_KEY:-}" ]; then
              MODEL_ID=$(curl -sf --max-time 30 \
                -H "Authorization: Bearer ${KIMI_API_KEY}" \
                https://api.moonshot.cn/v1/models \
                | jq -r '.data[].id' 2>/dev/null | head -n 1 || true)
              if [ -n "${MODEL_ID}" ]; then
                PROVIDER="moonshot"
              fi
            fi

            if [ -z "${PROVIDER}" ]; then
              echo "[loop] no provider/model available, retry in 10 minutes..."
              sleep 600
              continue
            fi

            echo "[loop] using provider=${PROVIDER}, model=${MODEL_ID}"

            # ---------- 2. 生成配置 ----------
            sed "s|__MODEL__|${MODEL_ID}|g" \
              ~/.config/opencode/template.${PROVIDER}.json \
              > ~/.config/opencode/opencode.json

            # ---------- 3. 运行 opencode（无单次时间限制） ----------
            set +e
            opencode run \
              --model "${PROVIDER}/${MODEL_ID}" \
              "继续按照仓库中的说明/任务文件推进工作，自主迭代改进。"
            RUN_RC=$?
            set -e
            echo "[loop] opencode exited with rc=${RUN_RC}"

            # ---------- 4. 提交本轮改动 ----------
            git add -A
            if git diff --cached --quiet; then
              echo "[loop] no changes to commit"
            else
              git commit -m "chore(opencode): loop #${LOOP} update $(date -u '+%Y-%m-%d %H:%M UTC')"
              git push origin HEAD
              echo "[loop] changes pushed"
            fi

            # ---------- 5. 失败退避 ----------
            if [ "${RUN_RC}" -ne 0 ]; then
              echo "[loop] opencode failed, backoff 5 minutes"
              sleep 300
            else
              sleep 30
            fi
          done

      - name: Final commit and push
        if: always()
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no leftover changes"
          else
            git commit -m "chore(opencode): final sync $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD || true
          fi