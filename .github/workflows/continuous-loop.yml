name: Continuous Loop

# Re-enabled on 2026-10-22 by the operator: P5T (the one-shot test-split
# confirmation) is deferred, so the agent loop is allowed to edit code again.
# The loop can rewrite and push source code, and it can change CODE_SEMANTICS.
#
# Freeze hazard worth remembering: the frozen manifest binds only the declared
# CODE_SEMANTICS constant ('v11.128' in exp_lib.py), NOT the file's own hash.
# An agent edit can therefore change measurement semantics while the stamp
# still matches, and P5T would admit it silently.  Before running P5T, check
# exp_lib.py against its sha256 at re-enable time
# (4a6cc34cfaac2388d2286a6370d0d91da8d932039e8ecb707a7c4f58af813579) and
# re-freeze consciously if it changed.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: continuous-loop
  cancel-in-progress: false

jobs:
  run-opencode:
    # Kill switch: the loop self-dispatches, so one dispatch keeps it alive
    # indefinitely.  Clear the CONTINUOUS_LOOP_ENABLED repository variable to
    # stop it: the next queued run then evaluates this guard as false, skips,
    # and dispatches no successor.
    if: vars.CONTINUOUS_LOOP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
      actions: write

    steps:
      # ⭐ 立刻续跑（上）：本 run 一开始就把「下一个 run」排进 concurrency 队列。
      # concurrency.cancel-in-progress=false → 组内 1 running + 1 pending，
      # 本 run 无论以何种方式结束（成功 / 失败 / 超时被取消 / runner 宕机），
      # 队列里的后继 run 都会在几秒内自动开始；不依赖任何收尾步骤是否被执行。
      - name: Queue next run (immediate hand-off)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          # 组内是否已有「另一个」排队中的 run（排除当前 run 自己：
          # 它刚启动时 API 状态可能还是 pending，不能当成后继）
          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }
          Q="$(pending_other)"
          # 查询失败时按 0 处理：宁可多派一个（会被队列合并），也绝不能漏派而断链
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] queued successors before dispatch: ${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需重复派发"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              for _ in 1 2 3 4 5 6; do
                sleep 5
                Q="$(pending_other)"
                case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
                if [ "$Q" != "0" ]; then
                  echo "[loop] 后继 run 已排队（attempt ${attempt}）——当前 run 一结束它就会立刻起跑"
                  exit 0
                fi
              done
              echo "[loop][warn] 派发已提交但暂未看到排队的 run（attempt ${attempt}）"
            else
              echo "[loop][warn] 派发失败（attempt ${attempt}）"
            fi
            sleep 10
          done
          echo "[loop][warn] 未能确认后继 run；收尾的 next-run job 与 */5 心跳会补位"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space (keep miniconda)
        run: |
          set +e
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after cleanup ==="
          df -h /

      - name: Setup Python (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt
            pyproject.toml

      # npm 全局包缓存：本仓库没有 package-lock.json，无法用 setup-node 的 `cache: npm`
      # （它要求 lock 文件存在），因此直接缓存 ~/.npm，`npm i -g` 会复用其中的 tarball。
      - name: Cache npm and Hugging Face
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/huggingface
          key: ${{ runner.os }}-npm-hf-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-npm-hf-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure swap (safe version)
        run: |
          set -e
          echo "=== Before ==="
          free -h
          df -h /

          sudo systemctl disable --now systemd-oomd.socket systemd-oomd.service 2>/dev/null || true

          sudo modprobe zram 2>/dev/null || true
          if [ -e /dev/zram0 ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (8G, prio=100)" \
              || echo "[warn] zram enable failed"
          else
            echo "[info] zram not available, skip"
          fi

          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_MB=$((AVAIL_KB / 1024))
          WANT_MB=$((AVAIL_MB - 3072))
          if [ "$WANT_MB" -gt 8192 ]; then WANT_MB=8192; fi
          if [ "$WANT_MB" -lt 2048 ]; then WANT_MB=2048; fi
          echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
            echo "[info] fallocate failed, falling back to dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=none
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"

          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=200
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.dirty_ratio=40
          sudo sysctl -w vm.dirty_background_ratio=10
          sudo sysctl -w vm.watermark_scale_factor=200 2>/dev/null || true

          echo "=== After ==="
          free -h
          swapon --show
          df -h /

      - name: Install Python test deps (cached)
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install AI harnesses (dsh primary, opencode fallback)
        run: |
          set +e
          # 主 harness：DeepSeek Harness（dsh，官方 CLI，走 DeepSeek 官方 API）
          npm i -g @deepseek-ai/dsh@0.2.1-rc.2
          if command -v dsh >/dev/null 2>&1; then
            dsh --version
          else
            echo "[warn] dsh 安装失败，将使用 opencode 兜底"
          fi
          # 兜底 harness：opencode（Zen 免费模型池）
          npm i -g opencode-ai
          if command -v opencode >/dev/null 2>&1; then
            opencode --version
          else
            echo "[warn] opencode 安装失败"
          fi
          if ! command -v dsh >/dev/null 2>&1 && ! command -v opencode >/dev/null 2>&1; then
            echo "[error] dsh 与 opencode 均不可用" >&2
            exit 1
          fi

      - name: Configure AI harnesses (dsh primary, opencode fallback)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          mkdir -p ~/.config/opencode
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "[info] DEEPSEEK_API_KEY 已配置（dsh 走 DeepSeek 官方 API）"
          else
            echo "[warn] DEEPSEEK_API_KEY 未配置：dsh 不可用，将走 opencode 兜底"
          fi
          if command -v dsh >/dev/null 2>&1; then
            echo "[info] dsh $(dsh --version) | provider=deepseek-official | model=deepseek-flash"
          fi
          if command -v opencode >/dev/null 2>&1; then
            echo "[info] opencode $(opencode --version) | fallback ready"
          fi

      - name: Configure opencode permissions (fallback harness)
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "permission": {
              "*": "allow",
              "edit": {
                "*": "allow",
                ".github/**": "deny",
                "**/.github/**": "deny",
                "LICENSE": "deny",
                "**/LICENSE": "deny",
                "**/LICENSE.*": "deny"
              },
              "bash": {
                "*": "allow",
                "rm -rf .github*": "deny",
                "rm -r .github*": "deny",
                "rm .github*": "deny",
                "mv .github*": "deny",
                "git rm -r .github*": "deny",
                "rm *LICENSE*": "deny",
                "mv *LICENSE*": "deny",
                "cp *LICENSE*": "deny",
                "git rm *LICENSE*": "deny",
                "git push*": "deny"
              }
            },
            "model": "opencode/deepseek-v4.1-flash-free"
          }
          EOF
          # 基准配置备份：opencode 兜底切换 provider（官方 API ↔ 免费池）时用它恢复，
          # 保证 permission 防护（.github / LICENSE / git push 禁改）在任何 provider 下都在
          cp -f ~/.config/opencode/opencode.json ~/.config/opencode/opencode.base.json

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run AI harness for ~3 hours (phases per iteration)
        timeout-minutes: 180
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +e
          set -o pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          OUT=/tmp/oc_out.log
          # 单次 run 的硬预算：3 小时（step 上限 180 分钟，job 上限 200 分钟，
          # 这里留 10 分钟给收尾的清理 / 最终提交 / 推送）
          RUN_HOURS=3
          DEADLINE=$(( $(date +%s) + RUN_HOURS*3600 - 600 ))

          # ================= 五阶段提示词 =================
          PROMPT_PERF='优化代码的性能和显存占用，不要输出或写入"优化了哪些内容"的报告。注意以后可能会scale。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。DECISION_LOG.md 是入库的决策记录，绝对不能删除或移动。'
          PROMPT_BUG='仔细检查代码中是否存在bug，如果有就修改代码。注意以后可能会scale。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'

          # ================= 科研方法改进阶段（sci）：提示词池，每次运行时随机选一个 =================
          # SCI_1 为通用提示词：只要求改进科研方法，不指定改进哪一方面；
          # SCI_2~SCI_6 各自只聚焦一个方面：实验设计与准备 / 数据处理 / 可复现性与工程规范 / 对比实验与消融 / 结果分析。
          PROMPT_SCI_1='改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_2='从实验设计与准备的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_3='从数据处理的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_4='从可复现性与工程规范的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_5='从对比实验与消融的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_6='从结果分析的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          # SINGLE 与 SCI_1~6 一起进入随机池：命中时本轮 sci 做单因素实验检查。
          PROMPT_SINGLE='确保需要是单因素实验的实验都是单因素实验。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_CLEAN='不要修改 docs/design_notes.md（设计笔记，不属于“多余的内容”）；确保远程仓库里没有实验结果文件、REPORTxx.md、autodl_budgetxx.json 以及算力申请.md（该文件已废弃，若再次出现请删除）；确保 docs 目录只保留 design_notes.md；docs/compute_plan.md 已废弃并从仓库删除，绝对不要重新创建；确保远程仓库中没有任何关于性能、预算、花费、修复了哪些bug和显存占用的记录（包括注释），但 docs/design_notes.md 中的设计记录除外。删除所有多余的内容。注意：.github 目录是 CI 配置，必须原样保留，绝对不能删除、修改或移动其中任何文件，它不属于“多余的内容”；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样必须原样保留，绝对不能删除或移动，也不属于“多余的内容”；DECISION_LOG.md 与 RELEASES.md 是入库的证据/决策记录，同样必须原样保留，绝对不能删除或移动。'
          PROMPT_APPLY='确保 docs/design_notes.md 存在且没有被误删或清空；若发现算力申请.md 再次出现则删除它（已废弃）。docs/compute_plan.md 已废弃并从仓库删除，绝对不要重新创建。不要修改 docs/design_notes.md 的内容。不要删除或移动 README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）；.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件。'

          # 每阶段单次调用的最大时长（秒）
          # 所有 opencode 调用的超时统一为 3 小时（受全局剩余时间 DEADLINE 收窄）：
          # 阶段正常结束会立即返回，上限只在模型卡住时生效。
          PERF_TIMEOUT=$((3*3600))     # 3h（性能与显存优化；当前该阶段已停用）
          BUG_TIMEOUT=$((3*3600))      # 3h
          SCI_TIMEOUT=$((3*3600))      # 3h
          CLEAN_TIMEOUT=$((3*3600))     # 3h（当前该阶段已从主循环移除）
          APPLY_TIMEOUT=$((3*3600))     # 3h（算力申请.md 检查）

          # ================= harness 策略：dsh 主用，opencode 兜底 =================
          # 优先 DeepSeek Harness（dsh）+ DeepSeek 官方 API（模型 deepseek-flash）：
          #   - dsh 无法安装 / key 未配置 / 冒烟失败 / 阶段调用失败时，自动切换 opencode；
          #   - opencode 兜底级联：DeepSeek 官方 API（openai-compatible，复用
          #     DEEPSEEK_API_KEY，模型探测自动校准，优先 deepseek-flash）
          #     → Zen 免费 deepseek-v4.1-flash-free → big-pickle；
          #   - dsh 路径一律 `dsh --profile headless "$prompt"`（key 从环境变量读取）；
          #     opencode 路径一律 `opencode run -m <model> [--variant ...] "$prompt"`。
          # 一旦切换到 opencode，本 run 内不再回头尝试 dsh。
          DSH_MODEL="deepseek-official/deepseek-flash"
          FREE_MODEL="opencode/deepseek-v4.1-flash-free"
          PICKLE_MODEL="opencode/big-pickle"
          HARNESS=""
          CURRENT_PROVIDER=""
          BROKEN_PROVIDERS=""
          SELECTED_MODEL=""
          SELECTED_PROVIDER=""
          SELECTED_VARIANT=""

          mark_broken() {
            case ",$BROKEN_PROVIDERS," in *",$1,"*) ;; *) BROKEN_PROVIDERS="$BROKEN_PROVIDERS${BROKEN_PROVIDERS:+,}$1" ;; esac
          }
          is_broken() {
            case ",$BROKEN_PROVIDERS," in *",$1,"*) return 0 ;; *) return 1 ;; esac
          }

          # ---------- DeepSeek 官方 API 探测（opencode 兜底路径使用） ----------
          # GET /models 健康检查 + 模型解析（优先 deepseek-flash，其次 deepseek-chat，
          # 再次任意含 chat 的 id，最后列表第一个）+ 生成 opencode 的 provider 配置模板。
          # 模板会合并当前 opencode.json 的 permission 块：切换到官方 provider 后
          # .github / LICENSE / git push 的防护不会丢。
          cat > /tmp/probe_deepseek.py <<'PYEOF'
          import json, os, sys, urllib.request

          def emit(status, model=''):
              print((status + ' ' + model).strip())
              sys.exit(0)

          key = os.environ.get('DEEPSEEK_API_KEY', '').strip()
          if not key:
              emit('DOWN')
          try:
              req = urllib.request.Request(
                  'https://api.deepseek.com/models',
                  headers={'Authorization': 'Bearer ' + key})
              with urllib.request.urlopen(req, timeout=20) as r:
                  d = json.load(r)
          except Exception:
              emit('DOWN')

          ids = [m.get('id', '') for m in (d.get('data') or []) if m.get('id')]
          mid = 'deepseek-chat'
          if 'deepseek-flash' in ids:
              mid = 'deepseek-flash'
          elif [i for i in ids if 'deepseek-flash' in i]:
              mid = [i for i in ids if 'deepseek-flash' in i][0]
          elif 'deepseek-chat' in ids:
              mid = 'deepseek-chat'
          elif [i for i in ids if 'deepseek-chat' in i]:
              mid = [i for i in ids if 'deepseek-chat' in i][0]
          elif [i for i in ids if 'chat' in i]:
              mid = [i for i in ids if 'chat' in i][0]
          elif ids:
              mid = ids[0]

          cfg = {}
          base = os.path.expanduser('~/.config/opencode/opencode.json')
          if os.path.exists(base):
              try:
                  with open(base) as f:
                      cfg = json.load(f)
              except Exception:
                  cfg = {}
          cfg['$schema'] = 'https://opencode.ai/config.json'
          cfg.setdefault('provider', {})
          cfg['provider']['deepseek'] = {
              'npm': '@ai-sdk/openai-compatible',
              'name': 'DeepSeek',
              'options': {
                  'baseURL': 'https://api.deepseek.com/v1',
                  'apiKey': '{env:DEEPSEEK_API_KEY}',
              },
              'models': {mid: {'name': mid}},
          }
          cfg['model'] = 'deepseek/' + mid
          try:
              os.makedirs(os.path.expanduser('~/.config/opencode'), exist_ok=True)
              with open(os.path.expanduser('~/.config/opencode/opencode.deepseek.json'), 'w') as f:
                  json.dump(cfg, f, indent=2, ensure_ascii=False)
          except Exception:
              pass
          emit('OK', mid)
          PYEOF

          probe_deepseek() {
            local out st mid
            out="$(python3 /tmp/probe_deepseek.py 2>/dev/null)" || out="DOWN"
            st="${out%% *}"; mid="${out#* }"
            if [ "$st" = "OK" ] && [ "$mid" != "$out" ] && [ -n "$mid" ]; then
              DEEPSEEK_MODEL="$mid"; return 0
            fi
            DEEPSEEK_MODEL=""; return 1
          }

          # ---------- 切换 opencode 的 provider（每次调用都重写配置，防 agent 篡改） ----------
          # deepseek：官方 API 模板（探测时已合并 permission）；
          # free/pickle：从基准配置 opencode.base.json 恢复（权限防护 + 免费池默认模型），
          # 不删除配置文件，保证防护在任何 provider 下都在。
          switch_provider() {
            case "$1" in
              deepseek)
                cp -f "$HOME/.config/opencode/opencode.deepseek.json" \
                      "$HOME/.config/opencode/opencode.json" 2>/dev/null || true
                CURRENT_PROVIDER="deepseek"
                ;;
              free|pickle)
                if [ -f "$HOME/.config/opencode/opencode.base.json" ]; then
                  cp -f "$HOME/.config/opencode/opencode.base.json" \
                        "$HOME/.config/opencode/opencode.json" 2>/dev/null || true
                else
                  echo "[warn] opencode.base.json 缺失，沿用当前 opencode 配置"
                fi
                CURRENT_PROVIDER="$1"
                ;;
            esac
          }

          # ---------- 一次性模型探测（每个 run 只做一次） ----------
          # run 开始时探测一次，选定 harness 与 SELECTED_MODEL；之后所有阶段直接调用。
          # 只有收到 429 / 5xx / 连接失败 / 非零退出时，才重新探测并跳过已判定失效的候选。
          # 注意：只看 /models 目录不够——必须真跑一次冒烟调用，否则会选中
          # “连得上但永远跑不完”的端点。
          smoke_test() {
            local m="$1" extra=""
            case "$m" in "$FREE_MODEL") [ -n "$VARIANT" ] && extra="--variant $VARIANT" ;; esac
            # shellcheck disable=SC2086
            timeout --kill-after=30 120 opencode run -m "$m" $extra "只回复两个字：OK" > /tmp/smoke_test.log 2>&1
          }

          detect_provider() {
            local pass cand model
            for pass in 1 2; do
              # 兜底第一优先级：DeepSeek 官方 API（经 opencode 的 openai-compatible provider）
              if ! is_broken deepseek && [ -n "${DEEPSEEK_API_KEY:-}" ] && probe_deepseek; then
                switch_provider deepseek
                if smoke_test "deepseek/$DEEPSEEK_MODEL"; then
                  SELECTED_MODEL="deepseek/$DEEPSEEK_MODEL"
                  SELECTED_PROVIDER="deepseek"
                  SELECTED_VARIANT=""
                  CURRENT_MODEL="$SELECTED_MODEL"
                  CURRENT_PROVIDER="$SELECTED_PROVIDER"
                  export SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT CURRENT_MODEL CURRENT_PROVIDER
                  echo "[provider] 选定 $SELECTED_MODEL（DeepSeek 官方 API，opencode 兜底），本次 run 内固定使用，不再逐阶段探测"
                  return 0
                fi
                echo "[warn] deepseek/$DEEPSEEK_MODEL 冒烟测试失败/超时，换下一个候选"
                mark_broken deepseek
              fi
              # Zen 免费池：deepseek-v4.1-flash-free → big-pickle
              for cand in free pickle; do
                is_broken "$cand" && continue
                case "$cand" in
                  free)   model="$FREE_MODEL" ;;
                  pickle) model="$PICKLE_MODEL" ;;
                esac
                switch_provider "$cand"
                if smoke_test "$model"; then
                  SELECTED_MODEL="$model"
                  SELECTED_PROVIDER="$cand"
                  # 只有免费 deepseek 支持 reasoning effort 档位
                  SELECTED_VARIANT=""
                  [ "$cand" = "free" ] && SELECTED_VARIANT="${VARIANT:-}"
                  CURRENT_MODEL="$SELECTED_MODEL"
                  CURRENT_PROVIDER="$SELECTED_PROVIDER"
                  export SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT CURRENT_MODEL CURRENT_PROVIDER
                  echo "[provider] 选定 $model（$cand）${SELECTED_VARIANT:+ variant=$SELECTED_VARIANT}，本次 run 内固定使用，不再逐阶段探测"
                  return 0
                fi
                echo "[warn] $model 冒烟测试失败/超时，换下一个候选"
                mark_broken "$cand"
              done
              # 第一轮全部失效：清空失效标记再试一轮（可能是瞬时故障）
              [ "$pass" -eq 1 ] && BROKEN_PROVIDERS=""
            done
            SELECTED_MODEL=""
            SELECTED_PROVIDER=""
            SELECTED_VARIANT=""
            CURRENT_MODEL=""
            CURRENT_PROVIDER=""
            export SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT CURRENT_MODEL CURRENT_PROVIDER
            return 1
          }

          # ---------- dsh 主用 / opencode 兜底的 harness 选择 ----------
          dsh_smoke() {
            timeout --kill-after=30 180 dsh --profile headless "只回复两个字：OK" > /tmp/dsh_smoke_test.log 2>&1
          }

          use_dsh() {
            HARNESS="dsh"
            SELECTED_MODEL="$DSH_MODEL"
            SELECTED_PROVIDER="deepseek-official"
            SELECTED_VARIANT=""
            CURRENT_MODEL="$SELECTED_MODEL"
            CURRENT_PROVIDER="$SELECTED_PROVIDER"
            export HARNESS SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT CURRENT_MODEL CURRENT_PROVIDER
            echo "[provider] 主 harness=dsh（DeepSeek Harness + 官方 API），模型=$SELECTED_MODEL"
          }

          switch_to_opencode() {
            HARNESS="opencode"
            SELECTED_MODEL=""
            SELECTED_PROVIDER=""
            SELECTED_VARIANT=""
            CURRENT_MODEL=""
            CURRENT_PROVIDER=""
            export HARNESS SELECTED_MODEL SELECTED_PROVIDER SELECTED_VARIANT CURRENT_MODEL CURRENT_PROVIDER
            echo "[warn] dsh 不可用，切换到 opencode 兜底（官方 API → Zen 免费池）"
            detect_provider
          }

          select_harness_model() {
            # 已切换到 opencode 后，本 run 内不再回头尝试 dsh
            if [ "$HARNESS" = "opencode" ]; then
              detect_provider
              return $?
            fi
            # 主路径：DeepSeek Harness（dsh）+ DeepSeek 官方 API + deepseek-flash
            if command -v dsh >/dev/null 2>&1; then
              if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
                echo "[warn] DEEPSEEK_API_KEY 未配置，dsh 无法调用官方 API，跳过 dsh"
              else
                use_dsh
                if dsh_smoke; then
                  return 0
                fi
                echo "[warn] dsh 冒烟测试失败（API key / 网络 / 配额 / 安装），切换 opencode 兜底"
                tail -n 15 /tmp/dsh_smoke_test.log 2>/dev/null || true
              fi
            else
              echo "[warn] dsh 未安装，直接使用 opencode 兜底"
            fi
            switch_to_opencode
          }

          oc_mark_broken() {
            mark_broken "$1"
          }

          # ---------- 思考强度（仅免费 deepseek 路径）：有 max 选 max，没有 max 选 high，否则不设置 ----------
          # 先刷新 opencode 的模型目录缓存（models.dev），再解析该模型支持的
          # reasoning effort 档位。检测失败时兜底 max（无效 variant 会被
          # opencode 静默忽略，不会导致调用失败）。
          opencode models opencode --refresh >/dev/null 2>&1 || true
          cat > /tmp/detect_variant.py <<'PYEOF'
          import json, os, sys
          try:
              p = os.path.expanduser('~/.cache/opencode/models.json')
              with open(p) as f:
                  d = json.load(f)
              m = d.get('opencode', {}).get('models', {}).get('deepseek-v4.1-flash-free')
              if m is None:
                  print('UNKNOWN')
                  sys.exit()
              values = []
              for o in (m.get('reasoning_options') or []):
                  values.extend(o.get('values') or [])
              for cand in ('max', 'high'):
                  if cand in values:
                      print(cand)
                      sys.exit()
              print('NONE')
          except Exception:
              print('UNKNOWN')
          PYEOF
          VRESULT=$(python3 /tmp/detect_variant.py 2>/dev/null)
          case "$VRESULT" in
            max|high) VARIANT="$VRESULT" ;;
            NONE)     VARIANT="" ;;
            *)        VARIANT="max" ;;
          esac
          echo "[info] 免费池模型=$FREE_MODEL | 思考强度=${VARIANT:-<不设置>} (detect=$VRESULT)"
          # run 开始时探测一次（dsh 优先，opencode 兜底）；失败也不阻塞，run_phase 需要时会再试
          if select_harness_model; then :; else echo "[warn] 启动时未选出可用模型，第一个阶段会再探测一次"; fi


          i=0


          # ================= README.md 防删自愈 =================
          # clean 阶段可能把 README.md 当作“多余内容”删除。
          # 每次提交前校验：一旦被删，立即从 HEAD（其次最近一个包含它的历史版本）恢复；
          # 只防删除，允许正常的内容修改。
          ensure_readme() {
            # 保护所有语言版本的 README（README.md / README_zh.md / README_en.md）。
            # 只防删除；内容修改不受影响。
            for f in README.md README_zh.md README_en.md DECISION_LOG.md RELEASES.md; do
              [ -f "$f" ] && continue
              if git show "HEAD:$f" > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
                mv /tmp/readme_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 HEAD 恢复"
                continue
              fi
              F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
              if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md "$f"
                echo "[guard] 检测到 $f 被删除，已从历史版本 ${F_SHA:0:7} 恢复"
              else
                echo "[warn] $f 缺失且找不到可恢复的历史版本"
              fi
            done
          }
          ensure_readme

          # ================= docs 防删自愈 =================
          # docs/design_notes.md（设计笔记）与 README 守卫同一逻辑：只防删除，允许正常的内容修改。
          # docs/compute_plan.md 已废弃并从仓库删除，这里不再恢复它。
          ensure_docs() {
            for f in docs/design_notes.md; do
              [ -f "$f" ] && continue
              if git show "HEAD:$f" > /tmp/docs_restore.md 2>/dev/null && [ -s /tmp/docs_restore.md ]; then
                mv /tmp/docs_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 HEAD 恢复"
                continue
              fi
              F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
              if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/docs_restore2.md 2>/dev/null && [ -s /tmp/docs_restore2.md ]; then
                mv /tmp/docs_restore2.md "$f"
                echo "[guard] 检测到 $f 被删除，已从历史版本 ${F_SHA:0:7} 恢复"
              else
                echo "[warn] $f 缺失且找不到可恢复的历史版本"
              fi
            done
          }
          ensure_docs

          # ---------- 提交信息附带本轮实际使用的模型（写入 /tmp/last_model_used.txt） ----------
          MODEL_TAG_FILE=/tmp/last_model_used.txt
          record_model() {
            printf '%s' "$1" > "$MODEL_TAG_FILE" 2>/dev/null || true
          }
          model_tag() {
            local m=""
            [ -f "$MODEL_TAG_FILE" ] && m="$(head -c 120 "$MODEL_TAG_FILE" 2>/dev/null)"
            [ -n "$m" ] && printf ' [model: %s]' "$m"
            return 0
          }

          commit_and_push() {
            # ⭐ 保护循环自身：回滚 AI 对 .github 的改动，防止 workflow 被改坏导致循环中断
            git checkout HEAD -- .github 2>/dev/null || true
            git clean -fdq .github 2>/dev/null || true
            ensure_readme
            ensure_docs
            # compute_plan.md 已废弃删除：任何阶段重新生成的副本都不入库
            rm -f docs/compute_plan.md
            rm -f .opencode_issues.md
            git add -A || true
            git commit -m "auto: iteration $1$(model_tag)" || true
            git pull --rebase origin "$BRANCH" || git rebase --abort || true
            git push origin "HEAD:${BRANCH}" || echo "[warn] push $1 failed"
          }

          on_shutdown() {
            echo "[trap] 收到 runner 终止信号，保存未提交的改动..."
            # ⭐ 保护循环自身：回滚 AI 对 .github 的改动，防止 workflow 被改坏导致循环中断
            git checkout HEAD -- .github 2>/dev/null || true
            git clean -fdq .github 2>/dev/null || true
            ensure_readme
            ensure_docs
            # compute_plan.md 已废弃删除：任何阶段重新生成的副本都不入库
            rm -f docs/compute_plan.md
            rm -f .opencode_issues.md
            git add -A || true
            if ! git diff --cached --quiet; then
              git commit -m "auto: partial work saved on shutdown$(model_tag)" || true
              git pull --rebase origin "$BRANCH" || git rebase --abort || true
              git push origin "HEAD:${BRANCH}" || true
              echo "[trap] partial work committed & pushed"
            else
              echo "[trap] nothing to commit"
            fi
            exit 0
          }
          trap on_shutdown TERM INT

          # ---------- 单阶段执行 ----------
          # 每个 run 只在 select_harness_model 里探测一次；这里按 HARNESS 直接调用。
          # 参数: phase_name  prompt  timeout_seconds
          # 返回: 0 成功 / 124|137|143 超时被杀（预算耗尽，改动照常提交）/ 1 时间用尽
          run_phase() {
            local phase="$1" prompt="$2" budget="$3"
            local attempt=0
            # 整个阶段（含所有重试）共用的硬上限：重试不得让总时长超过 budget
            local phase_end=$(( $(date +%s) + budget ))

            while :; do
              attempt=$((attempt+1))

              local NOW=$(date +%s)
              if [ "$NOW" -ge "$DEADLINE" ]; then
                echo "[info] phase=$phase 全局时间已用尽，跳过"
                return 1
              fi
              local REMAIN=$(( DEADLINE - NOW ))
              local budget_now=$(( phase_end - NOW ))
              [ "$budget_now" -gt "$REMAIN" ] && budget_now="$REMAIN"
              if [ "$budget_now" -le 60 ]; then
                echo "[info] phase=$phase 剩余时间不足，跳过"
                return 1
              fi

              # 正常路径：run 开始时已选定 harness/模型，这里不会发起任何网络探测
              if [ -z "$SELECTED_MODEL" ]; then
                if ! select_harness_model; then
                  echo "[warn] phase=$phase 暂时没有可用模型，180s 后重试 (attempt=$attempt)"
                  sleep 180
                  continue
                fi
              fi

              # 防止 agent 写入的 opencode 配置干扰后续调用
              rm -f ./opencode.json ./opencode.jsonc ./.opencode.json 2>/dev/null

              record_model "$SELECTED_MODEL"
              echo "=========== iter #$i | phase=$phase | attempt=$attempt | harness=$HARNESS | model=$SELECTED_MODEL ==========="
              if [ "$HARNESS" = "dsh" ]; then
                # 主 harness：DeepSeek Harness + DeepSeek 官方 API（deepseek-flash）
                timeout --kill-after=180 "$budget_now" dsh --profile headless "$prompt" 2>&1 | tee "$OUT"
              else
                # 兜底 harness：opencode（DeepSeek 官方 API / Zen 免费池）
                local oc_extra=""
                [ -n "$SELECTED_VARIANT" ] && oc_extra="--variant $SELECTED_VARIANT"
                # shellcheck disable=SC2086
                timeout --kill-after=180 "$budget_now" opencode run -m "$SELECTED_MODEL" $oc_extra "$prompt" 2>&1 | tee "$OUT"
              fi
              local EC=$?

              # 成功
              if [ $EC -eq 0 ]; then
                return 0
              fi

              # 超时 / 被杀：阶段预算耗尽属正常结束，改动照常提交
              if [ $EC -eq 124 ] || [ $EC -eq 137 ] || [ $EC -eq 143 ]; then
                echo "[warn] phase=$phase 超时/被杀 (exit=$EC)"
                return $EC
              fi

              # dsh 调用失败（非超时）→ 自动切到 opencode 兜底，本 run 内不再回头试 dsh
              if [ "$HARNESS" = "dsh" ]; then
                echo "[warn] phase=$phase dsh 调用失败 (exit=$EC)，切换 opencode 兜底"
                if switch_to_opencode; then
                  continue
                fi
                SELECTED_MODEL=""
                sleep 60
                continue
              fi

              # opencode 调用失败（非超时）→ 标记该模型失效，下一轮重新探测
              oc_mark_broken "$SELECTED_MODEL"

              # 429 限流 / 5xx / 连接失败：丢弃当前模型，下一次循环重新探测（并跳过它）
              if tail -40 "$OUT" | grep -qiE "too many requests|rate.?limit|status.{0,3}429|FreeTierError|free tier|status.{0,3}5[0-9][0-9]|econnreset|etimedout|fetch failed|socket hang up|connection (refused|reset)"; then
                echo "[warn] phase=$phase 限流/5xx/连接失败（$SELECTED_MODEL），重新探测 provider (attempt=$attempt)"
                mark_broken "$SELECTED_PROVIDER"
                SELECTED_MODEL=""
                sleep 60
                continue
              fi

              # 其它非零退出：同样丢弃当前模型并重新探测，直到阶段预算或全局时间用尽
              echo "[warn] phase=$phase 调用失败 (exit=$EC, model=$SELECTED_MODEL)，重新探测 provider (attempt=$attempt)"
              mark_broken "$SELECTED_PROVIDER"
              SELECTED_MODEL=""
              sleep 60
            done
          }

          # The per-phase prompt is passed through unchanged.  The former
          # fast_prompt() wrapper (which told the agent to scan for issues,
          # keep editing for as long as the budget allowed, and commit after
          # every change) was removed: it turned each phase into an unbounded
          # edit loop and could rewrite the frozen confirmation code mid-run.
          # .opencode_issues.md is no longer produced, but the cleanup step
          # still removes it defensively.

          # ================= 新增：概率测试门（20% 执行 / 80% 跳过）=================
          # 在「修复 bug 的 opencode 调用」提交之后触发（调用点见主循环 phase=bug 守卫）。
          # 掷骰子 1..100：≤20 才执行本步（80% 直接跳过）——跑一遍本仓库的测试；
          # 跑不通 → 调用 opencode 修复 → 修复结果按本仓库既有提交路径落到 main/master。
          maybe_run_tests() {
            local iter="$1"
            # 实测端到端只要 ~18s（165/165 passed；依赖已就绪时），成本可忽略：
            # 每次提交后都跑，不再按 20% 抽样（原先 80% 的提交从未被验证过）。
            echo "[test-gate] iter #$iter 执行全量测试"
            local TG_REMAIN=$(( DEADLINE - $(date +%s) ))
            if [ "$TG_REMAIN" -lt 1200 ]; then
              echo "[test-gate] 剩余时间不足 20 分钟，放弃本次测试"
              return 0
            fi
            cat > /tmp/tg_run.sh <<'TGEOF'
            set +e
            [ -f test_review_fixes.py ] || exit 42
            python3 -m pip install --quiet --upgrade pip >/dev/null 2>&1 || true
            python3 -m pip install --quiet numpy >/dev/null 2>&1 || exit 43
            python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu >/dev/null 2>&1 \
              || python3 -m pip install --quiet torch >/dev/null 2>&1 \
              || exit 43
            timeout 600 python3 -m pip install --quiet pytest tokenizers datasets matplotlib >/dev/null 2>&1 || exit 43
            python3 test_review_fixes.py
            exit $?
          TGEOF
            local TG_LOG=/tmp/test_gate.log
            echo "=========== TEST GATE (iter #$iter) ==========="
            timeout --kill-after=60 1500 bash /tmp/tg_run.sh > "$TG_LOG" 2>&1
            local TG_EC=$?
            tail -25 "$TG_LOG" 2>/dev/null || true
            if [ "$TG_EC" -eq 0 ]; then
              echo "[test-gate] 测试通过，无需修复"
              return 0
            fi
            if [ "$TG_EC" -eq 42 ]; then
              echo "[test-gate] 本仓库没有可识别的测试，跳过"
              return 0
            fi
            if [ "$TG_EC" -eq 43 ]; then
              echo "[test-gate] 测试依赖环境不可用（安装失败），跳过修复"
              return 0
            fi
            if [ "$TG_EC" -eq 124 ] || [ "$TG_EC" -eq 137 ] || [ "$TG_EC" -eq 143 ]; then
              echo "[test-gate] 测试超时/被中断 (exit=$TG_EC)，结果不确定，本轮不修复"
              return 0
            fi
            echo "[test-gate] 测试未通过 (exit=$TG_EC)，调用 opencode 修复"
            local TG_FIX_BUDGET=$(( DEADLINE - $(date +%s) - 900 ))
            if [ "$TG_FIX_BUDGET" -lt 900 ]; then
              echo "[test-gate] 剩余时间不足以安排修复，仅记录失败"
              return 0
            fi
            if [ "$TG_FIX_BUDGET" -gt 10800 ]; then TG_FIX_BUDGET=10800; fi
            {
              echo '本仓库的测试跑不通，请修复。复现方式：在仓库根目录运行 bash /tmp/tg_run.sh。'
              echo
              echo '失败日志（最后 80 行）：'
              tail -80 "$TG_LOG" 2>/dev/null
              echo
              echo '要求：'
              echo '1. 只修复导致测试失败的问题，不得削弱、跳过或删除测试，不得修改门禁脚本让断言失效；'
              echo '2. 不要借修复之名重写无关代码，保持原有功能语义不变；'
              echo '3. .github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；'
              echo '4. 修复后必须自行运行测试并确认完全通过。'
            } > /tmp/tg_fix_prompt.txt
            run_phase "testfix" "$(cat /tmp/tg_fix_prompt.txt)" "$TG_FIX_BUDGET" || true


            timeout --kill-after=30 600 bash /tmp/tg_run.sh > /tmp/test_gate_verify.log 2>&1
            local TG_VEC=$?
            if [ "$TG_VEC" -eq 0 ]; then
              echo "[test-gate] 修复后复跑测试：通过"
            else
              echo "[test-gate] 修复后复跑测试仍未通过 (exit=$TG_VEC)"
            fi

            commit_and_push "$iter-testfix"

            return 0
          }

          # ================= 主循环 =================
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))

            AVAIL_MB=$(( $(df --output=avail / | tail -1) / 1024 ))
            echo "--- iteration #$i | free disk: ${AVAIL_MB}MB ---"
            free -h | head -2
            if [ "$AVAIL_MB" -lt 2048 ]; then
              echo "[error] 磁盘剩余不足 2GB，提前结束循环，交给收尾步骤清理"
              break
            fi

            # ----- 阶段：perf 与 clean 已停用 → bug -> sci（7 选 1，含单因素）-> apply（clean 的清理工作交给收尾的 shell 步骤）-----
            # for phase in perf bug sci clean apply; do
            for phase in bug sci apply; do
              case "$phase" in
                perf)  P="$PROMPT_PERF";  T="$PERF_TIMEOUT"  ;;
                bug)   P="$PROMPT_BUG";   T="$BUG_TIMEOUT"   ;;
                sci)
                  # 科研方法改进：从 PROMPT_SCI_1~6 + PROMPT_SINGLE 中随机选一个提示词（7 选 1）
                  SCI_ROLL=$(( (RANDOM % 7) + 1 ))
                  case "$SCI_ROLL" in
                    1) P="$PROMPT_SCI_1"; SCI_LABEL='通用（不指定方面）' ;;
                    2) P="$PROMPT_SCI_2"; SCI_LABEL='实验设计与准备' ;;
                    3) P="$PROMPT_SCI_3"; SCI_LABEL='数据处理' ;;
                    4) P="$PROMPT_SCI_4"; SCI_LABEL='可复现性与工程规范' ;;
                    5) P="$PROMPT_SCI_5"; SCI_LABEL='对比实验与消融' ;;
                    6) P="$PROMPT_SCI_6"; SCI_LABEL='结果分析' ;;
                    7) P="$PROMPT_SINGLE"; SCI_LABEL='单因素实验' ;;
                  esac
                  T="$SCI_TIMEOUT"
                  echo "[info] sci 阶段随机选中科研方法提示词 #$SCI_ROLL：$SCI_LABEL"
                ;;
                clean) P="$PROMPT_CLEAN"; T="$CLEAN_TIMEOUT" ;;
                apply) P="$PROMPT_APPLY"; T="$APPLY_TIMEOUT" ;;
              esac

              # 收窄到剩余时间
              REMAIN=$(( DEADLINE - $(date +%s) ))
              if [ "$REMAIN" -le 0 ]; then
                echo "[info] 全局时间已到，退出循环"
                break 2
              fi
              if [ "$T" -gt "$REMAIN" ]; then T="$REMAIN"; fi

              echo ">>> iteration #$i | phase=$phase | budget=${T}s"
              run_phase "$phase" "$P" "$T"
              # 无论成功失败，先把已完成的改动提交上去
              commit_and_push "$i-$phase"

              # ⭐ 测试门：bug / sci 阶段提交后都跑一遍全量测试，详见 maybe_run_tests
              case "$phase" in
                bug|sci) maybe_run_tests "$i" ;;
              esac

              sleep 5
            done
          done

      - name: Cleanup repo artifacts
        if: always()
        run: |
          set +e
          rm -f .opencode_issues.md
          rm -f opencode.json opencode.jsonc .opencode.json 2>/dev/null
          find . -type f -name 'REPORT*.md'          -not -path './.git/*' -delete
          find . -type f -name 'autodl_budget*.json' -not -path './.git/*' -delete
          if [ -d docs ]; then
            find docs -mindepth 1 -maxdepth 1 ! -name 'design_notes.md' -exec rm -rf {} +
            [ -f docs/design_notes.md ] || : > docs/design_notes.md
          fi

      - name: Final commit and push
        if: always()
        run: |
          set +e
          # ⭐ 保护循环自身：回滚 AI 对 .github 的改动，防止 workflow 被改坏导致循环中断
          git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq .github 2>/dev/null || true
          # 防删自愈：收尾提交前恢复被删的 README.md
          if [ ! -f "README.md" ]; then
            if git show HEAD:README.md > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
              mv /tmp/readme_restore.md README.md
            else
              README_SHA=$(git log --format=%H --diff-filter=AM -- README.md 2>/dev/null | head -1)
              if [ -n "$README_SHA" ] && git show "${README_SHA}:README.md" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md README.md
              fi
            fi
            [ -f README.md ] && echo "[guard] 收尾阶段发现 README.md 被删，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删的 docs 设计笔记（compute_plan.md 已废弃，不恢复）
          for f in docs/design_notes.md; do
            if [ ! -f "$f" ]; then
              if git show "HEAD:$f" > /tmp/docs_restore.md 2>/dev/null && [ -s /tmp/docs_restore.md ]; then
                mv /tmp/docs_restore.md "$f"
              else
                F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
                if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/docs_restore2.md 2>/dev/null && [ -s /tmp/docs_restore2.md ]; then
                  mv /tmp/docs_restore2.md "$f"
                fi
              fi
              [ -f "$f" ] && echo "[guard] 收尾阶段发现 $f 被删，已恢复"
            fi
          done
          # compute_plan.md 已废弃删除：任何阶段重新生成的副本都不入库
          rm -f docs/compute_plan.md
          git add -A
          LAST_MODEL="$(head -c 120 /tmp/last_model_used.txt 2>/dev/null || true)"
          git commit -m "auto: end of 5h run, cleanup${LAST_MODEL:+ [model: $LAST_MODEL]}" || echo "nothing to commit"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || git rebase --abort || true
          git push origin "HEAD:${BRANCH}" || echo "[warn] final push failed"

      - name: Push to Gitee
        if: always()
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set +e
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "GITEE_TOKEN or GITEE_REPO not set, skipping Gitee push."
            exit 0
          fi
          BRANCH="${GITHUB_REF_NAME:-main}"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "HEAD:${BRANCH}" --force || echo "[warn] push to Gitee failed"
  # ===== loop hand-off (added) =====

  # ⭐ 立刻续跑（下）：独立的收尾 job。
  # needs + if: always()：工作 job 无论成功、失败、超时被取消，这个 job 都会紧接着启动（已实测验证）。
  # 这里无条件派发一个新的后继 run：它在组内排队，本 run 退出的一瞬间就被调度。
  # 万一这个 job 连启动都没机会（整个 run 被强杀），*/5 心跳会兜底。
  next-run:
    needs: [run-opencode]
    if: always() && vars.CONTINUOUS_LOOP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Ensure next run is queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              echo "[loop] 已派发后继 run（attempt ${attempt}）——本 run 结束后立刻起跑"
              exit 0
            fi
            echo "[loop][warn] 派发失败（attempt ${attempt}）10s 后重试"
            sleep 10
          done
          echo "[loop][warn] 派发失败；下一次 */5 心跳会补位"
          exit 0
