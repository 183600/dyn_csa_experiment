name: Continuous Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: continuous-loop
  cancel-in-progress: false

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space (keep miniconda)
        run: |
          set +e
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after cleanup ==="
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure swap (safe version)
        run: |
          set -e
          echo "=== Before ==="
          free -h
          df -h /

          # ---------- 0) 关闭 systemd-oomd ----------
          sudo systemctl disable --now systemd-oomd.socket systemd-oomd.service 2>/dev/null || true

          # ---------- 1) zram ----------
          sudo modprobe zram 2>/dev/null || true
          if [ -e /dev/zram0 ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (8G, prio=100)" \
              || echo "[warn] zram enable failed"
          else
            echo "[info] zram not available, skip"
          fi

          # ---------- 2) 磁盘 swapfile ----------
          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_MB=$((AVAIL_KB / 1024))
          WANT_MB=$((AVAIL_MB - 3072))
          if [ "$WANT_MB" -gt 8192 ]; then WANT_MB=8192; fi
          if [ "$WANT_MB" -lt 2048 ]; then WANT_MB=2048; fi
          echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
            echo "[info] fallocate failed, falling back to dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=none
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"

          # ---------- 3) 内核调优 ----------
          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=200
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.dirty_ratio=40
          sudo sysctl -w vm.dirty_background_ratio=10
          sudo sysctl -w vm.watermark_scale_factor=200 2>/dev/null || true

          echo "=== After ==="
          free -h
          swapon --show
          df -h /

      - name: Install opencode
        run: npm i -g opencode-ai

      - name: Configure opencode (Kimi 20% / DeepSeek 80%, fallback NVIDIA)
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          mkdir -p ~/.config/opencode

          # ---------- 模板 K：Kimi (Moonshot 官方) ----------
          cat > ~/.config/opencode/opencode.kimi.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "moonshot": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Moonshot",
                "options": {
                  "baseURL": "https://api.moonshot.cn/v1",
                  "apiKey": "{env:KIMI_API_KEY}"
                },
                "models": {
                  "kimi-k3": { "name": "kimi-k3" }
                }
              }
            },
            "model": "moonshot/kimi-k3"
          }
          EOF

          # ---------- 模板 D：DeepSeek 官方 ----------
          cat > ~/.config/opencode/opencode.deepseek.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "deepseek": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "DeepSeek",
                "options": {
                  "baseURL": "https://api.deepseek.com",
                  "apiKey": "{env:DEEPSEEK_API_KEY}"
                },
                "models": {
                  "deepseek-flash": { "name": "deepseek-flash" }
                }
              }
            },
            "model": "deepseek/deepseek-flash"
          }
          EOF

          # ---------- 模板 N：NVIDIA（最终 fallback） ----------
          cat > ~/.config/opencode/opencode.nvidia.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA",
                "options": {
                  "baseURL": "https://integrate.api.nvidia.com/v1",
                  "apiKey": "{env:NVIDIA_API_KEY}"
                },
                "models": {
                  "moonshotai/kimi-k3": { "name": "moonshotai/kimi-k3" }
                }
              }
            },
            "model": "nvidia/moonshotai/kimi-k3"
          }
          EOF

          # 默认先启用 DeepSeek；运行循环里每轮会重新抽签
          cp ~/.config/opencode/opencode.deepseek.json ~/.config/opencode/opencode.json

          echo "=== template (Kimi) ==="
          cat ~/.config/opencode/opencode.kimi.json
          echo "=== template (DeepSeek) ==="
          cat ~/.config/opencode/opencode.deepseek.json
          echo "=== template (NVIDIA) ==="
          cat ~/.config/opencode/opencode.nvidia.json

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode for ~5 hours
        timeout-minutes: 300
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set +e
          set -o pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          OUT=/tmp/oc_out.log
          DEADLINE=$(( $(date +%s) + 5*3600 - 900 ))
          PROMPT='确保代码没有影响实验结果的bug(修复所有的bug)，优化性能和显存占用(优化只要不会明显降低性能就可以做)，不要管之前修的bug，不要写修复了哪些bug，确保远程仓库里面没有实验结果和REPORTxx.md以及autodl_budgetxx.json，同时远程仓库docs目录只留design_notes.md，确保远程仓库里面没有性能、修复了哪些bug和显存占用的记录（注释里也没有）'
          ITER_TIMEOUT=10800   # 单次 opencode 最长 3 小时

          # ================= provider 选择策略 =================
          #   每轮开始：
          #     - 20% 概率尝试 Kimi（Moonshot 官方），健康检查通过就用
          #     - 否则（80%，或 Kimi 不可用）走 DeepSeek 官方，健康检查通过就用
          #     - DeepSeek 也不可用 -> 回退 NVIDIA
          #   运行中出错 / 429 会触发分级降级 + 冷却。
          # =====================================================
          KIMI_PROB=20          # Kimi 被选中的概率（%），其余走 DeepSeek
          KIMI_COOLDOWN=0       # Kimi 失败后的冷却轮数
          DEEPSEEK_COOLDOWN=0   # DeepSeek 失败后的冷却轮数

          i=0
          FAIL_COUNT=0
          RATE_COUNT=0
          CURRENT_PROVIDER=deepseek

          commit_and_push() {
            git add -A || true
            git commit -m "auto: iteration $1" || true
            git pull --rebase origin "$BRANCH" || git rebase --abort || true
            git push origin "HEAD:${BRANCH}" || echo "[warn] push $1 failed"
          }

          on_shutdown() {
            echo "[trap] 收到 runner 终止信号，保存未提交的改动..."
            git add -A || true
            if ! git diff --cached --quiet; then
              git commit -m "auto: partial work saved on shutdown" || true
              git pull --rebase origin "$BRANCH" || git rebase --abort || true
              git push origin "HEAD:${BRANCH}" || true
              echo "[trap] partial work committed & pushed"
            else
              echo "[trap] nothing to commit"
            fi
            exit 0
          }
          trap on_shutdown TERM INT

          # ---------- 健康检查（2xx = 可用，不消耗 token） ----------
          kimi_alive() {
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                   -H "Authorization: Bearer ${KIMI_API_KEY}" \
                   'https://api.moonshot.cn/v1/models' 2>/dev/null)
            echo "[info] Kimi 健康检查 /v1/models -> HTTP ${code:-timeout}"
            case "$code" in
              2*) return 0 ;;
              *)  return 1 ;;
            esac
          }
          deepseek_alive() {
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                   -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
                   'https://api.deepseek.com/models' 2>/dev/null)
            echo "[info] DeepSeek 健康检查 /models -> HTTP ${code:-timeout}"
            case "$code" in
              2*) return 0 ;;
              *)  return 1 ;;
            esac
          }

          # ---------- 切换 provider（真正换了才重置计数） ----------
          switch_provider() {
            case "$1" in
              kimi)
                if [ "$CURRENT_PROVIDER" != "kimi" ]; then
                  cp ~/.config/opencode/opencode.kimi.json ~/.config/opencode/opencode.json
                  CURRENT_PROVIDER=kimi
                  FAIL_COUNT=0
                  RATE_COUNT=0
                fi
                ;;
              deepseek)
                if [ "$CURRENT_PROVIDER" != "deepseek" ]; then
                  cp ~/.config/opencode/opencode.deepseek.json ~/.config/opencode/opencode.json
                  CURRENT_PROVIDER=deepseek
                  FAIL_COUNT=0
                  RATE_COUNT=0
                fi
                ;;
              nvidia)
                if [ "$CURRENT_PROVIDER" != "nvidia" ]; then
                  cp ~/.config/opencode/opencode.nvidia.json ~/.config/opencode/opencode.json
                  CURRENT_PROVIDER=nvidia
                  FAIL_COUNT=0
                  RATE_COUNT=0
                fi
                ;;
            esac
          }

          # ---------- 每轮开始时选 provider ----------
          pick_provider() {
            if [ $KIMI_COOLDOWN -gt 0 ]; then
              KIMI_COOLDOWN=$((KIMI_COOLDOWN-1))
            fi
            if [ $DEEPSEEK_COOLDOWN -gt 0 ]; then
              DEEPSEEK_COOLDOWN=$((DEEPSEEK_COOLDOWN-1))
            fi

            # 1) 20% 概率尝试 Kimi
            if [ $((RANDOM % 100)) -lt $KIMI_PROB ] && [ $KIMI_COOLDOWN -eq 0 ]; then
              if kimi_alive; then
                switch_provider kimi
                echo "[info] 第 $i 轮抽中 Kimi（${KIMI_PROB}%），使用 Moonshot 官方 API"
                return
              fi
              echo "[info] 抽中 Kimi 但端点不可用，回退 DeepSeek"
            elif [ $KIMI_COOLDOWN -gt 0 ]; then
              echo "[info] Kimi 冷却中（剩余 $KIMI_COOLDOWN 轮），本轮使用 DeepSeek"
            fi

            # 2) 默认路径（80% 抽签 + Kimi 回退）：DeepSeek
            if [ $DEEPSEEK_COOLDOWN -eq 0 ]; then
              if deepseek_alive; then
                switch_provider deepseek
                echo "[info] 第 $i 轮使用 DeepSeek 官方 API (deepseek-flash)"
                return
              fi
              echo "[info] DeepSeek 端点不可用，回退 NVIDIA"
            else
              echo "[info] DeepSeek 冷却中（剩余 $DEEPSEEK_COOLDOWN 轮），本轮使用 NVIDIA"
            fi

            # 3) 最后兜底：NVIDIA
            switch_provider nvidia
            echo "[info] 第 $i 轮使用 NVIDIA fallback"
          }

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))

            AVAIL_MB=$(( $(df --output=avail / | tail -1) / 1024 ))
            echo "--- iteration #$i | free disk: ${AVAIL_MB}MB ---"
            free -h | head -2
            if [ "$AVAIL_MB" -lt 2048 ]; then
              echo "[error] 磁盘剩余不足 2GB，提前结束循环，交给收尾步骤清理"
              break
            fi

            pick_provider

            echo "=========== opencode iteration #$i (provider=${CURRENT_PROVIDER}) ==========="

            timeout --kill-after=180 $ITER_TIMEOUT opencode run "$PROMPT" 2>&1 | tee "$OUT"
            EXIT_CODE=$?

            # ---------- 超时/被杀：改动照样提交，保住进度 ----------
            if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 137 ] || [ $EXIT_CODE -eq 143 ]; then
              FAIL_COUNT=$((FAIL_COUNT+1))
              echo "[warn] iteration $i 超时或被杀 (exit=$EXIT_CODE)，已完成的改动照常提交 (连续: $FAIL_COUNT)"
              commit_and_push "$i (partial, killed)"
              if [ $FAIL_COUNT -ge 3 ]; then
                echo "连续 3 次超时/被杀，结束本轮，等待定时任务唤醒"
                break
              fi
              sleep 10
              continue
            fi

            if [ $EXIT_CODE -ne 0 ]; then
              # ---------- 429 限流 ----------
              if tail -40 "$OUT" | grep -qiE "too many requests|rate.?limit|status.{0,3}429"; then
                if [ "$CURRENT_PROVIDER" = "kimi" ]; then
                  echo "[warn] iteration $i 命中 Kimi 限流(429)，切到 DeepSeek 重试"
                  KIMI_COOLDOWN=10
                  switch_provider deepseek
                  sleep 10
                  continue
                fi
                if [ "$CURRENT_PROVIDER" = "deepseek" ]; then
                  echo "[warn] iteration $i 命中 DeepSeek 限流(429)，切到 NVIDIA 重试"
                  DEEPSEEK_COOLDOWN=10
                  switch_provider nvidia
                  sleep 10
                  continue
                fi
                RATE_COUNT=$((RATE_COUNT+1))
                echo "[warn] iteration $i 命中 NVIDIA 限流(429) (连续: $RATE_COUNT)，退避 180 秒后重试"
                if [ $RATE_COUNT -ge 8 ]; then
                  echo "连续 8 次限流，结束本轮，等待定时任务唤醒"
                  break
                fi
                sleep 180
                continue
              fi

              RATE_COUNT=0
              FAIL_COUNT=$((FAIL_COUNT+1))
              echo "[warn] opencode iteration $i exited non-zero with code $EXIT_CODE (连续失败: $FAIL_COUNT)"

              # Kimi 异常 -> 冷却 + 立即切 DeepSeek
              if [ "$CURRENT_PROVIDER" = "kimi" ]; then
                echo "[info] Kimi 端点异常，切到 DeepSeek 重试"
                KIMI_COOLDOWN=10
                switch_provider deepseek
                sleep 10
                continue
              fi
              # DeepSeek 异常 -> 冷却 + 立即切 NVIDIA
              if [ "$CURRENT_PROVIDER" = "deepseek" ]; then
                echo "[info] DeepSeek 端点异常，切到 NVIDIA 重试"
                DEEPSEEK_COOLDOWN=10
                switch_provider nvidia
                sleep 10
                continue
              fi

              # NVIDIA 连续失败 -> 跳过本轮
              if [ $FAIL_COUNT -ge 3 ]; then
                echo "连续 3 次请求失败（可能是 API Key 错误或模型名不存在），跳过本轮，等待定时任务唤醒"
                break
              fi

              sleep 30
              continue
            else
              FAIL_COUNT=0
              RATE_COUNT=0
            fi

            commit_and_push "$i"

            sleep 5
          done

      - name: Cleanup repo artifacts
        if: always()
        run: |
          set +e
          find . -type f -name 'REPORT*.md'         -not -path './.git/*' -delete
          find . -type f -name 'autodl_budget*.json' -not -path './.git/*' -delete
          if [ -d docs ]; then
            find docs -mindepth 1 -maxdepth 1 ! -name 'design_notes.md' -exec rm -rf {} +
            [ -f docs/design_notes.md ] || : > docs/design_notes.md
          fi

      - name: Final commit and push
        if: always()
        run: |
          set +e
          git add -A
          git commit -m "auto: end of 5h run, cleanup" || echo "nothing to commit"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || git rebase --abort || true
          git push origin "HEAD:${BRANCH}" || echo "[warn] final push failed"

      - name: Trigger next workflow run (self-loop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME:-main}"
          gh workflow run continuous-loop.yml --ref "$BRANCH" \
            && echo "next run dispatched on ${BRANCH}" \
            || echo "[warn] dispatch failed, cron fallback will pick up"