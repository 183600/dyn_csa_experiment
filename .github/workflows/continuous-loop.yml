- name: Maximize swap memory
  run: |
    set -e
    echo "=== Before ==="
    free -h
    df -h /

    # ---------- 1) 启用 zram（压缩内存，优先级最高） ----------
    sudo modprobe zram 2>/dev/null || true
    if [ -e /dev/zram0 ]; then
      sudo swapoff /dev/zram0 2>/dev/null || true
      # disksize = 未压缩容量，实际内存占用约为 1/2 ~ 1/3
      echo 4G | sudo tee /sys/block/zram0/disksize >/dev/null || true
      sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
      sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (4G, prio=100)" \
        || echo "[warn] zram enable failed"
    else
      echo "[info] zram not available, skip"
    fi

    # ---------- 2) 创建尽可能大的磁盘 swapfile ----------
    AVAIL_KB=$(df --output=avail / | tail -1)
    AVAIL_MB=$((AVAIL_KB / 1024))
    # 预留 2GB 给文件系统，避免写满根分区
    WANT_MB=$((AVAIL_MB - 2048))
    # 上限 16GB（再多也没意义，反而拖慢 I/O）
    if [ "$WANT_MB" -gt 16384 ]; then WANT_MB=16384; fi
    # 下限保护
    if [ "$WANT_MB" -lt 1024 ]; then WANT_MB=1024; fi
    echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"

    sudo swapoff /swapfile 2>/dev/null || true
    sudo rm -f /swapfile
    # fallocate 很快；某些文件系统不支持则退回 dd
    if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
      echo "[info] fallocate failed, falling back to dd"
      sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=progress
    fi
    sudo chmod 600 /swapfile
    sudo mkswap /swapfile >/dev/null
    sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"

    # ---------- 3) 内核调优 ----------
    sudo sysctl -w vm.swappiness=100            # 最激进地使用 swap
    sudo sysctl -w vm.vfs_cache_pressure=50     # 少回收 inode/dentry 缓存
    sudo sysctl -w vm.overcommit_memory=1       # 允许超量分配
    sudo sysctl -w vm.dirty_ratio=80            # 大 I/O 时减少抖动
    sudo sysctl -w vm.dirty_background_ratio=50

    echo "=== After ==="
    free -h
    swapon --show
    df -h /