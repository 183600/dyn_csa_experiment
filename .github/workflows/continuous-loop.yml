name: Continuous Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: continuous-loop
  cancel-in-progress: false

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space (keep miniconda)
        run: |
          set +e
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after cleanup ==="
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure swap (safe version)
        run: |
          set -e
          echo "=== Before ==="
          free -h
          df -h /

          sudo systemctl disable --now systemd-oomd.socket systemd-oomd.service 2>/dev/null || true

          sudo modprobe zram 2>/dev/null || true
          if [ -e /dev/zram0 ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (8G, prio=100)" \
              || echo "[warn] zram enable failed"
          else
            echo "[info] zram not available, skip"
          fi

          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_MB=$((AVAIL_KB / 1024))
          WANT_MB=$((AVAIL_MB - 3072))
          if [ "$WANT_MB" -gt 8192 ]; then WANT_MB=8192; fi
          if [ "$WANT_MB" -lt 2048 ]; then WANT_MB=2048; fi
          echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
            echo "[info] fallocate failed, falling back to dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=none
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"

          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=200
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.dirty_ratio=40
          sudo sysctl -w vm.dirty_background_ratio=10
          sudo sysctl -w vm.watermark_scale_factor=200 2>/dev/null || true

          echo "=== After ==="
          free -h
          swapon --show
          df -h /

      - name: Install opencode
        run: npm i -g opencode-ai

      - name: Configure opencode (DeepSeek official 80% / NVIDIA GLM 20%)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          mkdir -p ~/.config/opencode
          # provider 配置模板由主循环的探测脚本按线上目录实时生成：
          #   opencode.deepseek.json —— DeepSeek 官方 API（主力，80%）
          #   opencode.nvidia.json   —— NVIDIA glm-5.3 / glm-5-3-flash（副选，20%）
          # opencode Zen 免费 deepseek（兜底）无需任何配置文件。
          # harness 永远是 opencode：所有 provider 一律通过 `opencode run -m ...` 调用。
          echo "[info] opencode 配置目录就绪；provider 模板将在主循环探测后生成"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode for ~5 hours (4 phases per iteration)
        timeout-minutes: 300
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set +e
          set -o pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          OUT=/tmp/oc_out.log
          DEADLINE=$(( $(date +%s) + 5*3600 - 900 ))

          # ================= 四阶段提示词 =================
          PROMPT_PERF='优化代码的性能和显存占用，不要输出或写入"优化了哪些内容"的报告。注意以后可能会scale。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_BUG='仔细检查代码中是否存在bug或者科研方法层面的问题，如果有就修改代码。注意以后可能会scale。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_CLEAN='不要修改 docs/compute_plan.md 与 docs/design_notes.md（前者是算力规划文档，允许包含预算与算力估算数字，二者都不属于“多余的内容”）；确保远程仓库里没有实验结果文件、REPORTxx.md、autodl_budgetxx.json 以及算力申请.md（该文件已废弃并被 docs/compute_plan.md 取代，若再次出现请删除）；确保 docs 目录只保留 design_notes.md 与 compute_plan.md；确保远程仓库中没有任何关于性能、预算、花费、修复了哪些bug和显存占用的记录（包括注释），但 docs/compute_plan.md 与 docs/design_notes.md 中的规划与设计记录除外。删除所有多余的内容。注意：.github 目录是 CI 配置，必须原样保留，绝对不能删除、修改或移动其中任何文件，它不属于“多余的内容”；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样必须原样保留，绝对不能删除或移动，也不属于“多余的内容”。'
          PROMPT_APPLY='确保 docs/compute_plan.md 存在且没有被误删或清空；若发现算力申请.md 再次出现则删除它（已被 docs/compute_plan.md 取代）。不要修改 docs/compute_plan.md 与 docs/design_notes.md 的内容。不要删除或移动 README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）；.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件。'

          # 每阶段单次调用的最大时长（秒）
          PERF_TIMEOUT=$((60*60))     # 1h（性能与显存优化）
          BUG_TIMEOUT=$((60*60))      # 1h
          CLEAN_TIMEOUT=$((30*60))    # 30m
          APPLY_TIMEOUT=$((60*60))    # 1h（算力申请.md 检查）

          # ================= provider 策略：80% DeepSeek 官方 / 20% NVIDIA GLM =================
          # 主力（80%）：DeepSeek 官方 API —— https://api.deepseek.com/v1，
          #             模型默认 deepseek-chat（官方稳定别名，探测目录自动校准）；
          # 副选（20%）：https://integrate.api.nvidia.com/v1 的 glm-5.3
          #             （目录中不存在时自动改用 glm-5-3-flash）；
          # 兜底：DeepSeek 与 NVIDIA 都不可用时，临时用 opencode Zen 免费
          #       deepseek（deepseek-v4.1-flash-free）保活循环，恢复后自动切回。
          # harness 永远是 opencode：所有 provider 一律通过 `opencode run -m ...` 调用。
          NVIDIA_PROB=20
          FREE_MODEL="opencode/deepseek-v4.1-flash-free"
          DEEPSEEK_MODEL=""
          NVIDIA_MODEL=""
          CURRENT_PROVIDER=""
          PROVIDER_BROKEN=""

          mark_broken() {
            case ",$PROVIDER_BROKEN," in *",$1,"*) ;; *) PROVIDER_BROKEN="$PROVIDER_BROKEN${PROVIDER_BROKEN:+,}$1" ;; esac
          }
          is_broken() {
            case ",$PROVIDER_BROKEN," in *",$1,"*) return 0 ;; *) return 1 ;; esac
          }

          # ---------- DeepSeek 官方 API 探测（健康检查 + 模型解析 + 生成配置模板） ----------
          cat > /tmp/probe_deepseek.py <<'PYEOF'
          import json, os, sys, urllib.request

          def emit(status, model=''):
              print((status + ' ' + model).strip())
              sys.exit(0)

          key = os.environ.get('DEEPSEEK_API_KEY', '').strip()
          if not key:
              emit('DOWN')
          try:
              req = urllib.request.Request(
                  'https://api.deepseek.com/models',
                  headers={'Authorization': 'Bearer ' + key})
              with urllib.request.urlopen(req, timeout=20) as r:
                  d = json.load(r)
          except Exception:
              emit('DOWN')

          ids = [m.get('id', '') for m in (d.get('data') or []) if m.get('id')]
          mid = 'deepseek-chat'
          if 'deepseek-chat' in ids:
              mid = 'deepseek-chat'
          elif [i for i in ids if 'deepseek-chat' in i]:
              mid = [i for i in ids if 'deepseek-chat' in i][0]
          elif [i for i in ids if 'chat' in i]:
              mid = [i for i in ids if 'chat' in i][0]
          elif ids:
              mid = ids[0]

          cfg = {
              '$schema': 'https://opencode.ai/config.json',
              'provider': {
                  'deepseek': {
                      'npm': '@ai-sdk/openai-compatible',
                      'name': 'DeepSeek',
                      'options': {
                          'baseURL': 'https://api.deepseek.com/v1',
                          'apiKey': '{env:DEEPSEEK_API_KEY}',
                      },
                      'models': {mid: {'name': mid}},
                  }
              },
              'model': 'deepseek/' + mid,
          }
          try:
              os.makedirs(os.path.expanduser('~/.config/opencode'), exist_ok=True)
              with open(os.path.expanduser('~/.config/opencode/opencode.deepseek.json'), 'w') as f:
                  json.dump(cfg, f, indent=2, ensure_ascii=False)
          except Exception:
              pass
          emit('OK', mid)
          PYEOF

          probe_deepseek() {
            local out st mid
            out="$(python3 /tmp/probe_deepseek.py 2>/dev/null)" || out="DOWN"
            st="${out%% *}"; mid="${out#* }"
            if [ "$st" = "OK" ] && [ "$mid" != "$out" ] && [ -n "$mid" ]; then
              DEEPSEEK_MODEL="$mid"; return 0
            fi
            DEEPSEEK_MODEL=""; return 1
          }

          # ---------- NVIDIA GLM 探测：优先 glm-5.3，没有则 glm-5-3-flash ----------
          # 探测成功同时把 nvidia provider 配置写入 ~/.config/opencode/opencode.nvidia.json。
          cat > /tmp/probe_nvidia.py <<'PYEOF'
          import json, os, sys, urllib.request

          def emit(status, model=''):
              print((status + ' ' + model).strip())
              sys.exit(0)

          def norm(s):
              return s.lower().replace('.', '-').replace('_', '-')

          key = os.environ.get('NVIDIA_API_KEY', '').strip()
          if not key:
              emit('DOWN')
          try:
              req = urllib.request.Request(
                  'https://integrate.api.nvidia.com/v1/models',
                  headers={'Authorization': 'Bearer ' + key})
              with urllib.request.urlopen(req, timeout=20) as r:
                  d = json.load(r)
          except Exception:
              emit('DOWN')

          ids = [m.get('id', '') for m in (d.get('data') or []) if m.get('id')]

          def pick(cands, target):
              if not cands:
                  return ''
              def keyf(x):
                  return (0 if norm(x.rsplit('/', 1)[-1]) == target else 1, len(x))
              return sorted(cands, key=keyf)[0]

          primary = [i for i in ids if 'glm-5-3' in norm(i) and 'flash' not in norm(i)]
          flash = [i for i in ids if 'glm-5-3' in norm(i) and 'flash' in norm(i)]
          mid = pick(primary, 'glm-5-3') or pick(flash, 'glm-5-3-flash')
          if not mid:
              emit('NOMODEL')

          cfg = {}
          base = sys.argv[1] if len(sys.argv) > 1 else ''
          if base and os.path.exists(base):
              try:
                  with open(base) as f:
                      cfg = json.load(f)
              except Exception:
                  cfg = {}
          cfg['$schema'] = 'https://opencode.ai/config.json'
          cfg.setdefault('provider', {})
          cfg['provider']['nvidia'] = {
              'npm': '@ai-sdk/openai-compatible',
              'name': 'NVIDIA',
              'options': {
                  'baseURL': 'https://integrate.api.nvidia.com/v1',
                  'apiKey': '{env:NVIDIA_API_KEY}',
              },
              'models': {mid: {'name': mid}},
          }
          cfg['model'] = 'nvidia/' + mid
          try:
              os.makedirs(os.path.expanduser('~/.config/opencode'), exist_ok=True)
              with open(os.path.expanduser('~/.config/opencode/opencode.nvidia.json'), 'w') as f:
                  json.dump(cfg, f, indent=2, ensure_ascii=False)
          except Exception:
              pass
          emit('OK', mid)
          PYEOF

          probe_nvidia() {
            local out st mid
            out="$(python3 /tmp/probe_nvidia.py 2>/dev/null)" || out="DOWN"
            st="${out%% *}"; mid="${out#* }"
            if [ "$st" = "OK" ] && [ "$mid" != "$out" ] && [ -n "$mid" ]; then
              NVIDIA_MODEL="$mid"; return 0
            fi
            NVIDIA_MODEL=""; return 1
          }

          # ---------- 切换 provider（每次调用都重写配置，防 agent 篡改） ----------
          switch_provider() {
            case "$1" in
              deepseek)
                cp -f "$HOME/.config/opencode/opencode.deepseek.json" \
                      "$HOME/.config/opencode/opencode.json" 2>/dev/null || true
                CURRENT_PROVIDER="deepseek"
                ;;
              nvidia)
                cp -f "$HOME/.config/opencode/opencode.nvidia.json" \
                      "$HOME/.config/opencode/opencode.json" 2>/dev/null || true
                CURRENT_PROVIDER="nvidia"
                ;;
              free)
                rm -f "$HOME/.config/opencode/opencode.json" \
                      "$HOME/.config/opencode/opencode.jsonc" \
                      "$HOME/.config/opencode/config.json" 2>/dev/null
                CURRENT_PROVIDER="free"
                ;;
            esac
            FAIL_COUNT=0
            RATE_COUNT=0
          }

          # ---------- 每次调用按 80/20 抽样选 provider，失效自动换边 ----------
          pick_provider() {
            local roll=$((RANDOM % 100)) want alt
            if [ "$roll" -lt "$NVIDIA_PROB" ]; then want="nvidia"; else want="deepseek"; fi

            if [ "$want" = "nvidia" ]; then
              if ! is_broken nvidia && probe_nvidia; then
                switch_provider nvidia
                echo "[info] 抽中 NVIDIA GLM（${NVIDIA_PROB}%）：$NVIDIA_MODEL"
                return 0
              fi
              echo "[info] 抽中 NVIDIA 但端点/模型不可用（无 key / 失效 / 无 glm-5.3(-flash)），回退 DeepSeek 官方"
            else
              if ! is_broken deepseek && probe_deepseek; then
                switch_provider deepseek
                echo "[info] 使用 DeepSeek 官方 API（$((100-NVIDIA_PROB))%）：$DEEPSEEK_MODEL"
                return 0
              fi
              echo "[info] DeepSeek 官方端点不可用，尝试 NVIDIA"
            fi

            if [ "$want" = "nvidia" ]; then alt="deepseek"; else alt="nvidia"; fi
            if [ "$alt" = "deepseek" ]; then
              if ! is_broken deepseek && probe_deepseek; then
                switch_provider deepseek
                echo "[info] 回退 DeepSeek 官方：$DEEPSEEK_MODEL"
                return 0
              fi
            else
              if ! is_broken nvidia && probe_nvidia; then
                switch_provider nvidia
                echo "[info] 回退 NVIDIA GLM：$NVIDIA_MODEL"
                return 0
              fi
            fi

            # 两个官方端点都不可用：opencode Zen 免费 deepseek 兜底保活
            if ! is_broken free; then
              switch_provider free
              echo "[warn] DeepSeek/NVIDIA 均不可用，本轮使用 opencode Zen 免费 deepseek 兜底"
              return 0
            fi

            echo "[warn] 所有 provider 本阶段均失败过，重置失效标记继续尝试"
            PROVIDER_BROKEN=""
            switch_provider free
            return 0
          }

          # ---------- 思考强度（仅免费 deepseek 兜底路径）：max > high > 不设置 ----------
          # DeepSeek 官方与 NVIDIA GLM 走 openai-compatible 端点，不设置思考强度。
          # 免费兜底先从 opencode 模型目录（models.dev）解析其支持的
          # reasoning effort 档位：有 max 选 max，没有 max 选 high，否则不设置。
          # 检测失败时兜底 max（无效 variant 会被 opencode 静默忽略）。
          opencode models opencode --refresh >/dev/null 2>&1 || true
          cat > /tmp/detect_variant.py <<'PYEOF'
          import json, os, sys
          try:
              p = os.path.expanduser('~/.cache/opencode/models.json')
              with open(p) as f:
                  d = json.load(f)
              m = d.get('opencode', {}).get('models', {}).get('deepseek-v4.1-flash-free')
              if m is None:
                  print('UNKNOWN')
                  sys.exit()
              values = []
              for o in (m.get('reasoning_options') or []):
                  values.extend(o.get('values') or [])
              for cand in ('max', 'high'):
                  if cand in values:
                      print(cand)
                      sys.exit()
              print('NONE')
          except Exception:
              print('UNKNOWN')
          PYEOF
          VRESULT=$(python3 /tmp/detect_variant.py 2>/dev/null)
          case "$VRESULT" in
            max|high) VARIANT="$VRESULT" ;;
            NONE)     VARIANT="" ;;
            *)        VARIANT="max" ;;
          esac
          echo "[info] DeepSeek官方=$((100-NVIDIA_PROB))% | NVIDIA GLM=${NVIDIA_PROB}% | 兜底=$FREE_MODEL | 兜底思考强度=${VARIANT:-<不设置>} (detect=$VRESULT)"

          i=0
          FAIL_COUNT=0
          RATE_COUNT=0


          # ================= README.md 防删自愈 =================
          # clean 阶段可能把 README.md 当作“多余内容”删除。
          # 每次提交前校验：一旦被删，立即从 HEAD（其次最近一个包含它的历史版本）恢复；
          # 只防删除，允许正常的内容修改。
          ensure_readme() {
            # 保护所有语言版本的 README（README.md / README_zh.md / README_en.md）。
            # 只防删除；内容修改不受影响。
            for f in README.md README_zh.md README_en.md; do
              [ -f "$f" ] && continue
              if git show "HEAD:$f" > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
                mv /tmp/readme_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 HEAD 恢复"
                continue
              fi
              F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
              if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md "$f"
                echo "[guard] 检测到 $f 被删除，已从历史版本 ${F_SHA:0:7} 恢复"
              else
                echo "[warn] $f 缺失且找不到可恢复的历史版本"
              fi
            done
          }
          ensure_readme

          # ================= docs 防删自愈 =================
          # docs/compute_plan.md（算力规划）与 docs/design_notes.md（设计笔记）
          # 与 README 守卫同一逻辑：只防删除，允许正常的内容修改。
          ensure_docs() {
            for f in docs/compute_plan.md docs/design_notes.md; do
              [ -f "$f" ] && continue
              if git show "HEAD:$f" > /tmp/docs_restore.md 2>/dev/null && [ -s /tmp/docs_restore.md ]; then
                mv /tmp/docs_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 HEAD 恢复"
                continue
              fi
              F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
              if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/docs_restore2.md 2>/dev/null && [ -s /tmp/docs_restore2.md ]; then
                mv /tmp/docs_restore2.md "$f"
                echo "[guard] 检测到 $f 被删除，已从历史版本 ${F_SHA:0:7} 恢复"
              else
                echo "[warn] $f 缺失且找不到可恢复的历史版本"
              fi
            done
          }
          ensure_docs

          commit_and_push() {
            # ⭐ 保护循环自身：回滚 AI 对 .github 的改动，防止 workflow 被改坏导致循环中断
            git checkout HEAD -- .github 2>/dev/null || true
            git clean -fdq .github 2>/dev/null || true
            ensure_readme
            ensure_docs
            git add -A || true
            git commit -m "auto: iteration $1" || true
            git pull --rebase origin "$BRANCH" || git rebase --abort || true
            git push origin "HEAD:${BRANCH}" || echo "[warn] push $1 failed"
          }

          on_shutdown() {
            echo "[trap] 收到 runner 终止信号，保存未提交的改动..."
            # ⭐ 保护循环自身：回滚 AI 对 .github 的改动，防止 workflow 被改坏导致循环中断
            git checkout HEAD -- .github 2>/dev/null || true
            git clean -fdq .github 2>/dev/null || true
            ensure_readme
            ensure_docs
            git add -A || true
            if ! git diff --cached --quiet; then
              git commit -m "auto: partial work saved on shutdown" || true
              git pull --rebase origin "$BRANCH" || git rebase --abort || true
              git push origin "HEAD:${BRANCH}" || true
              echo "[trap] partial work committed & pushed"
            else
              echo "[trap] nothing to commit"
            fi
            exit 0
          }
          trap on_shutdown TERM INT

          # ---------- 单阶段执行（80/20 抽样选 provider，失效自动换边，反复重试） ----------
          # 参数: phase_name  prompt  timeout_seconds
          # 返回: 0 成功 / 124|137|143 超时被杀（预算耗尽，改动照常提交）/ 1 时间用尽
          run_phase() {
            local phase="$1" prompt="$2" budget="$3"
            local attempt=0
            FAIL_COUNT=0
            RATE_COUNT=0
            PROVIDER_BROKEN=""

            while :; do
              attempt=$((attempt+1))

              local NOW=$(date +%s)
              if [ "$NOW" -ge "$DEADLINE" ]; then
                echo "[info] phase=$phase 全局时间已用尽，跳过"
                return 1
              fi
              local REMAIN=$(( DEADLINE - NOW ))
              [ "$budget" -gt "$REMAIN" ] && budget="$REMAIN"
              if [ "$budget" -le 60 ]; then
                echo "[info] phase=$phase 剩余时间不足，跳过"
                return 1
              fi

              pick_provider
              local MODEL_DESC="$FREE_MODEL"
              case "$CURRENT_PROVIDER" in
                deepseek) MODEL_DESC="deepseek/$DEEPSEEK_MODEL" ;;
                nvidia)   MODEL_DESC="nvidia/$NVIDIA_MODEL" ;;
              esac
              echo "=========== iter #$i | phase=$phase | attempt=$attempt | provider=$CURRENT_PROVIDER | model=$MODEL_DESC ==========="

              # 防止 agent 写入的 opencode 配置干扰后续调用：
              # deepseek/nvidia 路径恢复探测生成的模板，free 路径确保无自定义配置
              # （switch_provider 已处理 ~/.config/opencode/，这里只清仓库内残留）
              rm -f ./opencode.json ./opencode.jsonc ./.opencode.json 2>/dev/null

              case "$CURRENT_PROVIDER" in
                deepseek)
                  timeout --kill-after=180 "$budget" opencode run -m "deepseek/$DEEPSEEK_MODEL" "$prompt" 2>&1 | tee "$OUT"
                  ;;
                nvidia)
                  timeout --kill-after=180 "$budget" opencode run -m "nvidia/$NVIDIA_MODEL" "$prompt" 2>&1 | tee "$OUT"
                  ;;
                free)
                  if [ -n "$VARIANT" ]; then
                    timeout --kill-after=180 "$budget" opencode run -m "$FREE_MODEL" --variant "$VARIANT" "$prompt" 2>&1 | tee "$OUT"
                  else
                    timeout --kill-after=180 "$budget" opencode run -m "$FREE_MODEL" "$prompt" 2>&1 | tee "$OUT"
                  fi
                  ;;
              esac
              local EC=$?

              # 成功
              if [ $EC -eq 0 ]; then
                return 0
              fi

              # 超时 / 被杀：阶段预算耗尽属正常结束，改动照常提交
              if [ $EC -eq 124 ] || [ $EC -eq 137 ] || [ $EC -eq 143 ]; then
                echo "[warn] phase=$phase 超时/被杀 (exit=$EC)"
                return $EC
              fi

              # 429 限流 / 免费额度限制：标记当前 provider 本阶段失效，换边重试
              if tail -40 "$OUT" | grep -qiE "too many requests|rate.?limit|status.{0,3}429|FreeTierError|free tier"; then
                RATE_COUNT=$((RATE_COUNT+1))
                mark_broken "$CURRENT_PROVIDER"
                echo "[warn] phase=$phase 命中限流/额度限制 (provider=$CURRENT_PROVIDER, 连续: $RATE_COUNT)，180s 后换 provider 重试 (attempt=$attempt)"
                sleep 180
                continue
              fi

              # 其它非零退出：标记当前 provider 本阶段失效，换边重试，
              # 直到阶段预算或全局时间用尽
              RATE_COUNT=0
              mark_broken "$CURRENT_PROVIDER"
              echo "[warn] phase=$phase provider=$CURRENT_PROVIDER 调用失败 (exit=$EC)，60s 后换 provider 重试 (attempt=$attempt)"
              sleep 60
            done

            return 1
          }

          # ================= 主循环 =================
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))

            AVAIL_MB=$(( $(df --output=avail / | tail -1) / 1024 ))
            echo "--- iteration #$i | free disk: ${AVAIL_MB}MB ---"
            free -h | head -2
            if [ "$AVAIL_MB" -lt 2048 ]; then
              echo "[error] 磁盘剩余不足 2GB，提前结束循环，交给收尾步骤清理"
              break
            fi

            # ----- 四个阶段：perf -> bug -> clean -> apply -----
            for phase in perf bug clean apply; do
              case "$phase" in
                perf)  P="$PROMPT_PERF";  T="$PERF_TIMEOUT"  ;;
                bug)   P="$PROMPT_BUG";   T="$BUG_TIMEOUT"   ;;
                clean) P="$PROMPT_CLEAN"; T="$CLEAN_TIMEOUT" ;;
                apply) P="$PROMPT_APPLY"; T="$APPLY_TIMEOUT" ;;
              esac

              # 收窄到剩余时间
              REMAIN=$(( DEADLINE - $(date +%s) ))
              if [ "$REMAIN" -le 0 ]; then
                echo "[info] 全局时间已到，退出循环"
                break 2
              fi
              if [ "$T" -gt "$REMAIN" ]; then T="$REMAIN"; fi

              echo ">>> iteration #$i | phase=$phase | budget=${T}s"
              run_phase "$phase" "$P" "$T"

              # 无论成功失败，先把已完成的改动提交上去
              commit_and_push "$i-$phase"

              sleep 5
            done
          done

      - name: Cleanup repo artifacts
        if: always()
        run: |
          set +e
          rm -f opencode.json opencode.jsonc .opencode.json 2>/dev/null
          find . -type f -name 'REPORT*.md'          -not -path './.git/*' -delete
          find . -type f -name 'autodl_budget*.json' -not -path './.git/*' -delete
          if [ -d docs ]; then
            find docs -mindepth 1 -maxdepth 1 ! -name 'design_notes.md' ! -name 'compute_plan.md' -exec rm -rf {} +
            [ -f docs/design_notes.md ] || : > docs/design_notes.md
          fi

      - name: Final commit and push
        if: always()
        run: |
          set +e
          # ⭐ 保护循环自身：回滚 AI 对 .github 的改动，防止 workflow 被改坏导致循环中断
          git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq .github 2>/dev/null || true
          # 防删自愈：收尾提交前恢复被删的 README.md
          if [ ! -f "README.md" ]; then
            if git show HEAD:README.md > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
              mv /tmp/readme_restore.md README.md
            else
              README_SHA=$(git log --format=%H --diff-filter=AM -- README.md 2>/dev/null | head -1)
              if [ -n "$README_SHA" ] && git show "${README_SHA}:README.md" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md README.md
              fi
            fi
            [ -f README.md ] && echo "[guard] 收尾阶段发现 README.md 被删，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删的 docs 文档（算力规划与设计笔记）
          for f in docs/compute_plan.md docs/design_notes.md; do
            if [ ! -f "$f" ]; then
              if git show "HEAD:$f" > /tmp/docs_restore.md 2>/dev/null && [ -s /tmp/docs_restore.md ]; then
                mv /tmp/docs_restore.md "$f"
              else
                F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
                if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/docs_restore2.md 2>/dev/null && [ -s /tmp/docs_restore2.md ]; then
                  mv /tmp/docs_restore2.md "$f"
                fi
              fi
              [ -f "$f" ] && echo "[guard] 收尾阶段发现 $f 被删，已恢复"
            fi
          done
          git add -A
          git commit -m "auto: end of 5h run, cleanup" || echo "nothing to commit"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || git rebase --abort || true
          git push origin "HEAD:${BRANCH}" || echo "[warn] final push failed"

      - name: Push to Gitee
        if: always()
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set +e
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "GITEE_TOKEN or GITEE_REPO not set, skipping Gitee push."
            exit 0
          fi
          BRANCH="${GITHUB_REF_NAME:-main}"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "HEAD:${BRANCH}" --force || echo "[warn] push to Gitee failed"

      - name: Trigger next workflow run (self-loop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME:-main}"
          gh workflow run continuous-loop.yml --ref "$BRANCH" \
            && echo "next run dispatched on ${BRANCH}" \
            || echo "[warn] dispatch failed, cron fallback will pick up"