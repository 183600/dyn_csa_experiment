name: Continuous Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: continuous-loop
  cancel-in-progress: false

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write

    steps:
      # ⭐ 立刻续跑（上）：本 run 一开始就把「下一个 run」排进 concurrency 队列。
      # concurrency.cancel-in-progress=false → 组内 1 running + 1 pending，
      # 本 run 无论以何种方式结束（成功 / 失败 / 超时被取消 / runner 宕机），
      # 队列里的后继 run 都会在几秒内自动开始；不依赖任何收尾步骤是否被执行。
      - name: Queue next run (immediate hand-off)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          # 组内是否已有「另一个」排队中的 run（排除当前 run 自己：
          # 它刚启动时 API 状态可能还是 pending，不能当成后继）
          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }
          Q="$(pending_other)"
          # 查询失败时按 0 处理：宁可多派一个（会被队列合并），也绝不能漏派而断链
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] queued successors before dispatch: ${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需重复派发"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              for _ in 1 2 3 4 5 6; do
                sleep 5
                Q="$(pending_other)"
                case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
                if [ "$Q" != "0" ]; then
                  echo "[loop] 后继 run 已排队（attempt ${attempt}）——当前 run 一结束它就会立刻起跑"
                  exit 0
                fi
              done
              echo "[loop][warn] 派发已提交但暂未看到排队的 run（attempt ${attempt}）"
            else
              echo "[loop][warn] 派发失败（attempt ${attempt}）"
            fi
            sleep 10
          done
          echo "[loop][warn] 未能确认后继 run；收尾的 next-run job 与 */5 心跳会补位"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 不给 agent 留任何 git 推送凭证：所有推送必须走 commit_and_push /
          # on_shutdown / Final 的显式 token URL（即必须先过 DeepSeek 把关）。
          persist-credentials: false

      - name: Free up disk space (keep miniconda)
        run: |
          set +e
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after cleanup ==="
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure swap (safe version)
        run: |
          set -e
          echo "=== Before ==="
          free -h
          df -h /

          sudo systemctl disable --now systemd-oomd.socket systemd-oomd.service 2>/dev/null || true

          sudo modprobe zram 2>/dev/null || true
          if [ -e /dev/zram0 ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (8G, prio=100)" \
              || echo "[warn] zram enable failed"
          else
            echo "[info] zram not available, skip"
          fi

          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_MB=$((AVAIL_KB / 1024))
          WANT_MB=$((AVAIL_MB - 3072))
          if [ "$WANT_MB" -gt 8192 ]; then WANT_MB=8192; fi
          if [ "$WANT_MB" -lt 2048 ]; then WANT_MB=2048; fi
          echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
            echo "[info] fallocate failed, falling back to dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=none
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"

          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=200
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.dirty_ratio=40
          sudo sysctl -w vm.dirty_background_ratio=10
          sudo sysctl -w vm.watermark_scale_factor=200 2>/dev/null || true

          echo "=== After ==="
          free -h
          swapon --show
          df -h /

      - name: Install opencode
        run: npm i -g opencode-ai

      - name: Configure opencode (zen free models via OPENCODE_API_KEY)
        run: |
          mkdir -p ~/.config/opencode
          # 主模型全面切换为 opencode Zen 免费模型（OPENCODE_API_KEY 认证，
          # 无需任何自定义 provider 配置文件）；每个阶段随机挑选一个免费模型，
          # 失败自动换下一个随机免费模型（.github/scripts/pick_free_model.py）。
          # DeepSeek 官方 API 不再承担编码，只作为 push 前的把关人
          # （.github/scripts/deepseek_gate.py 审查全部待推送 diff）。
          # harness 永远是 opencode：一律通过 `opencode run -m opencode/<model>` 调用。
          echo "[info] opencode 配置目录就绪；免费模型随机挑选 + DeepSeek 把关已就位"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode for ~5 hours (5 phases per iteration)
        timeout-minutes: 300
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          set -o pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          # 远程已批准基准（把关与回滚都以它为准，而不是可能被 agent 改过的本地 HEAD）
          REMOTE_BASE="origin/${BRANCH}"
          # 推送专用 URL：Checkout 不留凭证后，只有把关流程能拿到
          PUSH_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          OUT=/tmp/oc_out.log
          DEADLINE=$(( $(date +%s) + 5*3600 - 900 ))

          # ================= 五阶段提示词 =================
          PROMPT_PERF='优化代码的性能和显存占用，不要输出或写入"优化了哪些内容"的报告。注意以后可能会scale。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。DECISION_LOG.md 是入库的决策记录，绝对不能删除或移动。'
          PROMPT_BUG='仔细检查代码中是否存在bug，如果有就修改代码。注意以后可能会scale。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'

          PROMPT_CLEAN='不要修改 docs/design_notes.md（设计笔记，不属于“多余的内容”）；确保远程仓库里没有实验结果文件、REPORTxx.md、autodl_budgetxx.json 以及算力申请.md（该文件已废弃，若再次出现请删除）；确保 docs 目录只保留 design_notes.md；docs/compute_plan.md 已废弃并从仓库删除，绝对不要重新创建；确保远程仓库中没有任何关于性能、预算、花费、修复了哪些bug和显存占用的记录（包括注释），但 docs/design_notes.md 中的设计记录除外。删除所有多余的内容。注意：.github 目录是 CI 配置，必须原样保留，绝对不能删除、修改或移动其中任何文件，它不属于“多余的内容”；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样必须原样保留，绝对不能删除或移动，也不属于“多余的内容”；DECISION_LOG.md 与 RELEASES.md 是入库的证据/决策记录，同样必须原样保留，绝对不能删除或移动。'
          PROMPT_APPLY='确保 docs/design_notes.md 存在且没有被误删或清空；若发现算力申请.md 再次出现则删除它（已废弃）。docs/compute_plan.md 已废弃并从仓库删除，绝对不要重新创建。不要修改 docs/design_notes.md 的内容。不要删除或移动 README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）；.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件。'

          # 每阶段单次调用的最大时长（秒）
          PERF_TIMEOUT=$((60*60))     # 1h（性能与显存优化）
          BUG_TIMEOUT=$((60*60))      # 1h
          CLEAN_TIMEOUT=$((30*60))    # 30m
          APPLY_TIMEOUT=$((60*60))    # 1h（算力申请.md 检查）

          # ================= provider 策略：opencode Zen 免费模型随机轮换 =================
          # 每个阶段开始时从线上目录随机挑选一个免费模型（type=chat + 工具调用 + 价格为 0；
          # 目录不可用时回退 .github/scripts/pick_free_model.py 内置清单）。
          # 单个模型调用失败/限流 → 标记本阶段失效，换下一个随机免费模型重试；
          # 全部免费模型都失效 → 清空失效标记重新随机（相当于整轮重置）。
          # DeepSeek 官方 API 不参与编码，只在 push 前把关（deepseek_gate）。
          CURRENT_MODEL=""
          BROKEN_MODELS=""

          mark_broken() {
            case ",$BROKEN_MODELS," in *",$1,"*) ;; *) BROKEN_MODELS="$BROKEN_MODELS${BROKEN_MODELS:+,}$1" ;; esac
          }

          # ---------- 随机免费模型挑选（线上目录实时过滤 + 内置清单兜底） ----------
          pick_random_free_model() {
            python3 .github/scripts/pick_free_model.py "$BROKEN_MODELS"
          }

          echo "[info] provider 策略：opencode Zen 免费模型随机轮换（每阶段随机挑选，失败自动换模型）；DeepSeek 官方 API 仅作 push 前把关"

          i=0
          FAIL_COUNT=0
          RATE_COUNT=0


          # ================= README.md 防删自愈 =================
          # clean 阶段可能把 README.md 当作“多余内容”删除。
          # 每次提交前校验：一旦被删，立即从 HEAD（其次最近一个包含它的历史版本）恢复；
          # 只防删除，允许正常的内容修改。
          ensure_readme() {
            # 保护所有语言版本的 README（README.md / README_zh.md / README_en.md）。
            # 只防删除；内容修改不受影响。
            for f in README.md README_zh.md README_en.md DECISION_LOG.md RELEASES.md; do
              [ -f "$f" ] && continue
              if git show "${REMOTE_BASE}:$f" > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
                mv /tmp/readme_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 ${REMOTE_BASE} 恢复"
                continue
              fi
              if git show "HEAD:$f" > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
                mv /tmp/readme_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 HEAD 恢复"
                continue
              fi
              F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
              if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md "$f"
                echo "[guard] 检测到 $f 被删除，已从历史版本 ${F_SHA:0:7} 恢复"
              else
                echo "[warn] $f 缺失且找不到可恢复的历史版本"
              fi
            done
          }
          ensure_readme

          # ================= docs 防删自愈 =================
          # docs/design_notes.md（设计笔记）与 README 守卫同一逻辑：只防删除，允许正常的内容修改。
          # docs/compute_plan.md 已废弃并从仓库删除，这里不再恢复它。
          ensure_docs() {
            for f in docs/design_notes.md; do
              [ -f "$f" ] && continue
              if git show "${REMOTE_BASE}:$f" > /tmp/docs_restore.md 2>/dev/null && [ -s /tmp/docs_restore.md ]; then
                mv /tmp/docs_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 ${REMOTE_BASE} 恢复"
                continue
              fi
              if git show "HEAD:$f" > /tmp/docs_restore.md 2>/dev/null && [ -s /tmp/docs_restore.md ]; then
                mv /tmp/docs_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 HEAD 恢复"
                continue
              fi
              F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
              if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/docs_restore2.md 2>/dev/null && [ -s /tmp/docs_restore2.md ]; then
                mv /tmp/docs_restore2.md "$f"
                echo "[guard] 检测到 $f 被删除，已从历史版本 ${F_SHA:0:7} 恢复"
              else
                echo "[warn] $f 缺失且找不到可恢复的历史版本"
              fi
            done
          }
          ensure_docs

          # ---------- 提交信息附带本轮实际使用的模型（写入 /tmp/last_model_used.txt） ----------
          MODEL_TAG_FILE=/tmp/last_model_used.txt
          record_model() {
            printf '%s' "$1" > "$MODEL_TAG_FILE" 2>/dev/null || true
          }
          model_tag() {
            local m=""
            [ -f "$MODEL_TAG_FILE" ] && m="$(head -c 120 "$MODEL_TAG_FILE" 2>/dev/null)"
            [ -n "$m" ] && printf ' [model: %s]' "$m"
            return 0
          }

          # ---------- DeepSeek 把关：push 前审查全部待推送改动 ----------
          # APPROVE → 照常提交推送；REJECT → 回滚本轮改动不推送；
          # UNAVAILABLE → 改动保留在工作区，跳过本次推送，下一轮重试。
          run_deepseek_gate() {
            # 刷新远程基准；失败则用已有引用（引用缺失按不可用处理，绝不放行未审内容）
            timeout 60 git fetch origin "$BRANCH" 2>/dev/null || true
            if ! git rev-parse --verify --quiet "$REMOTE_BASE" >/dev/null 2>&1; then
              echo "UNAVAILABLE"
              return 0
            fi
            # 待审范围 = 相对远程已批准状态的全部改动
            #（含暂存区、工作区、以及 agent 自己本地 commit 的内容）
            if git diff "$REMOTE_BASE" --quiet 2>/dev/null; then
              echo "APPROVE"
              return 0
            fi
            python3 .github/scripts/deepseek_gate.py "$1" "$BRANCH" 2>/dev/null || echo "UNAVAILABLE"
          }

          deepseek_gate() {
            local v=""
            for ga in 1 2 3; do
              v="$(run_deepseek_gate "$1")"
              case "$v" in
                APPROVE|REJECT:*) echo "$v"; return 0 ;;
              esac
              [ "$ga" -lt 3 ] && { echo "[gate] DeepSeek 把关暂不可用 (attempt $ga)，20s 后重试"; sleep 20; }
            done
            echo "$v"
          }

          commit_and_push() {
            # ⭐ 保护循环自身：以远程已批准状态为准回滚 AI 对 .github 的改动
            #   （本地 HEAD 可能已被 agent 的 commit 污染，不能作为恢复源）
            timeout 60 git fetch origin "$BRANCH" 2>/dev/null || true
            git checkout "$REMOTE_BASE" -- .github 2>/dev/null || git checkout HEAD -- .github 2>/dev/null || true
            git clean -fdq .github 2>/dev/null || true
            ensure_readme
            ensure_docs
            # compute_plan.md 已废弃删除：任何阶段重新生成的副本都不入库
            rm -f docs/compute_plan.md
            rm -f .opencode_issues.md
            git add -A || true

            # ⭐ DeepSeek 把关：必须审查通过才允许 push（含 agent 本地提交的全部待推送改动）
            local VERDICT
            VERDICT="$(deepseek_gate "$1")"
            case "$VERDICT" in
              APPROVE)
                echo "[gate] DeepSeek 把关通过 ($1)"
                ;;
              REJECT:*)
                echo "[gate] DeepSeek 拦截本次改动 ($1)，原因: ${VERDICT#REJECT:} —— 已回滚到远程基准，不推送"
                git reset --hard "$REMOTE_BASE" >/dev/null 2>&1 || true
                git clean -fdq >/dev/null 2>&1 || true
                ensure_readme
                ensure_docs
                return 1
                ;;
              *)
                echo "[gate] DeepSeek 把关不可用 ($1)，跳过本次推送；改动保留在工作区，下一轮重试"
                git reset >/dev/null 2>&1 || true
                return 1
                ;;
            esac

            git commit -m "auto: iteration $1$(model_tag)" || true
            git pull --rebase origin "$BRANCH" || git rebase --abort || true
            git push "$PUSH_URL" "HEAD:${BRANCH}" || echo "[warn] push $1 failed"
          }

          on_shutdown() {
            echo "[trap] 收到 runner 终止信号，保存未提交的改动..."
            # ⭐ 保护循环自身：以远程已批准状态为准回滚 AI 对 .github 的改动
            timeout 60 git fetch origin "$BRANCH" 2>/dev/null || true
            git checkout "$REMOTE_BASE" -- .github 2>/dev/null || git checkout HEAD -- .github 2>/dev/null || true
            git clean -fdq .github 2>/dev/null || true
            ensure_readme
            ensure_docs
            # compute_plan.md 已废弃删除：任何阶段重新生成的副本都不入库
            rm -f docs/compute_plan.md
            rm -f .opencode_issues.md
            git add -A || true
            if ! git diff "$REMOTE_BASE" --quiet 2>/dev/null; then
              # ⭐ DeepSeek 把关同样适用于 shutdown 收尾提交（单次尝试，快速退出）
              local VERDICT
              VERDICT="$(run_deepseek_gate "shutdown partial work")"
              case "$VERDICT" in
                APPROVE)
                  git commit -m "auto: partial work saved on shutdown$(model_tag)" || true
                  git pull --rebase origin "$BRANCH" || git rebase --abort || true
                  git push "$PUSH_URL" "HEAD:${BRANCH}" || true
                  echo "[trap] partial work committed & pushed (DeepSeek 把关通过)"
                  ;;
                REJECT:*)
                  echo "[trap] DeepSeek 拦截 shutdown 改动: ${VERDICT#REJECT:} —— 回滚，不推送"
                  git reset --hard "$REMOTE_BASE" >/dev/null 2>&1 || true
                  git clean -fdq >/dev/null 2>&1 || true
                  ;;
                *)
                  echo "[trap] DeepSeek 把关不可用，shutdown 改动不推送（把关优先）"
                  ;;
              esac
            else
              echo "[trap] nothing to commit"
            fi
            exit 0
          }
          trap on_shutdown TERM INT

          # ---------- 单阶段执行（每阶段随机免费模型，失败自动换模型重试） ----------
          # 参数: phase_name  prompt  timeout_seconds
          # 返回: 0 成功 / 124|137|143 超时被杀（预算耗尽，改动照常提交）/ 1 时间用尽
          run_phase() {
            local phase="$1" prompt="$2" budget="$3"
            local attempt=0
            FAIL_COUNT=0
            RATE_COUNT=0
            BROKEN_MODELS=""

            while :; do
              attempt=$((attempt+1))

              local NOW=$(date +%s)
              if [ "$NOW" -ge "$DEADLINE" ]; then
                echo "[info] phase=$phase 全局时间已用尽，跳过"
                return 1
              fi
              local REMAIN=$(( DEADLINE - NOW ))
              [ "$budget" -gt "$REMAIN" ] && budget="$REMAIN"
              if [ "$budget" -le 60 ]; then
                echo "[info] phase=$phase 剩余时间不足，跳过"
                return 1
              fi

              # 随机挑选一个免费模型；全部被排除则清空失效标记重新随机
              CURRENT_MODEL="$(pick_random_free_model)" || {
                echo "[warn] phase=$phase 免费模型全部失效，重置失效标记，120s 后重新随机 (attempt=$attempt)"
                BROKEN_MODELS=""
                sleep 120
                continue
              }
              local MODEL_DESC="opencode/$CURRENT_MODEL"
              echo "=========== iter #$i | phase=$phase | attempt=$attempt | model=$MODEL_DESC (免费随机) ==========="

              # 防止 agent 写入的 opencode 配置干扰后续调用：
              # zen 免费模型走内置 opencode provider，确保仓库内无自定义配置残留
              rm -f ./opencode.json ./opencode.jsonc ./.opencode.json 2>/dev/null

              record_model "$MODEL_DESC"
              timeout --kill-after=180 "$budget" opencode run -m "$MODEL_DESC" "$prompt" < /dev/null 2>&1 | tee "$OUT"
              local EC=$?

              # 成功
              if [ $EC -eq 0 ]; then
                return 0
              fi

              # 超时 / 被杀：阶段预算耗尽属正常结束，改动照常提交
              if [ $EC -eq 124 ] || [ $EC -eq 137 ] || [ $EC -eq 143 ]; then
                echo "[warn] phase=$phase 超时/被杀 (exit=$EC)"
                return $EC
              fi

              # 429 限流 / 免费额度限制：标记当前模型本阶段失效，换下一个随机免费模型
              if tail -40 "$OUT" | grep -qiE "too many requests|rate.?limit|status.{0,3}429|FreeTierError|free tier"; then
                RATE_COUNT=$((RATE_COUNT+1))
                mark_broken "$CURRENT_MODEL"
                echo "[warn] phase=$phase 命中限流/额度限制 (model=$CURRENT_MODEL, 连续: $RATE_COUNT)，180s 后换随机免费模型重试 (attempt=$attempt)"
                sleep 180
                continue
              fi

              # 其它非零退出：标记当前模型本阶段失效，换下一个随机免费模型重试，
              # 直到阶段预算或全局时间用尽
              RATE_COUNT=0
              mark_broken "$CURRENT_MODEL"
              echo "[warn] phase=$phase model=$CURRENT_MODEL 调用失败 (exit=$EC)，60s 后换随机免费模型重试 (attempt=$attempt)"
              sleep 60
            done

            return 1
          }

          # ================= 单次调用内“先定位、再修复” =================
          # 不再单独占用 detect 预算：把“快速定位问题”并入同一次 opencode 调用，
          # 让修复拿满整个阶段预算，减少一次模型调用的固定开销。
          # 目标是在预算内尽可能多完成高价值改动，而不是只做一两个小改动。
          ISSUES_FILE=".opencode_issues.md"
          fast_prompt() {
            case "$1" in
              perf) printf '先用不超过 5-8 分钟快速扫描性能热点（可写入 `%s`，该临时清单不是报告），然后持续优化；在本阶段预算内尽可能多完成高价值、可验证的优化，不要只做 1-2 个就停，也不要为了赶时间提前结束。每个改动后运行自检；修复完成后删除该临时清单。\n\n%s\n' "$ISSUES_FILE" "$2" ;;
              bug)  printf '先快速定位 bug（可把要点写入 `%s`，该临时清单不是报告），然后持续修复；在本阶段预算内尽可能多修复高价值、可验证的 bug，不要只修一个就停，也不要为了赶时间提前结束。每个修复后运行自检；修完删除该临时清单。\n\n%s\n' "$ISSUES_FILE" "$2" ;;
            esac
          }

          # ================= 新增：概率测试门（20% 执行 / 80% 跳过）=================
          # 在「修复 bug 的 opencode 调用」提交之后触发（调用点见主循环 phase=bug 守卫）。
          # 掷骰子 1..100：≤20 才执行本步（80% 直接跳过）——跑一遍本仓库的测试；
          # 跑不通 → 调用 opencode 修复 → 修复结果按本仓库既有提交路径落到 main/master。
          maybe_run_tests() {
            local iter="$1"
            local TG_ROLL=$(( (RANDOM % 100) + 1 ))
            if [ "$TG_ROLL" -gt 20 ]; then
              echo "[test-gate] iter #$iter 骰子 ${TG_ROLL}/100 > 20，本轮不跑测试（80%）"
              return 0
            fi
            echo "[test-gate] iter #$iter 骰子 ${TG_ROLL}/100 ≤ 20，本轮执行测试（20%）"
            local TG_REMAIN=$(( DEADLINE - $(date +%s) ))
            if [ "$TG_REMAIN" -lt 1200 ]; then
              echo "[test-gate] 剩余时间不足 20 分钟，放弃本次测试"
              return 0
            fi
            cat > /tmp/tg_run.sh <<'TGEOF'
            set +e
            [ -f test_review_fixes.py ] || exit 42
            python3 -m pip install --quiet --upgrade pip >/dev/null 2>&1 || true
            python3 -m pip install --quiet numpy >/dev/null 2>&1 || exit 43
            python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu >/dev/null 2>&1 \
              || python3 -m pip install --quiet torch >/dev/null 2>&1 \
              || exit 43
            timeout 600 python3 -m pip install --quiet tokenizers datasets matplotlib >/dev/null 2>&1 || exit 43
            python3 test_review_fixes.py
            exit $?
          TGEOF
            local TG_LOG=/tmp/test_gate.log
            echo "=========== TEST GATE (iter #$iter) ==========="
            timeout --kill-after=60 1500 bash /tmp/tg_run.sh > "$TG_LOG" 2>&1
            local TG_EC=$?
            tail -25 "$TG_LOG" 2>/dev/null || true
            if [ "$TG_EC" -eq 0 ]; then
              echo "[test-gate] 测试通过，无需修复"
              return 0
            fi
            if [ "$TG_EC" -eq 42 ]; then
              echo "[test-gate] 本仓库没有可识别的测试，跳过"
              return 0
            fi
            if [ "$TG_EC" -eq 43 ]; then
              echo "[test-gate] 测试依赖环境不可用（安装失败），跳过修复"
              return 0
            fi
            if [ "$TG_EC" -eq 124 ] || [ "$TG_EC" -eq 137 ] || [ "$TG_EC" -eq 143 ]; then
              echo "[test-gate] 测试超时/被中断 (exit=$TG_EC)，结果不确定，本轮不修复"
              return 0
            fi
            echo "[test-gate] 测试未通过 (exit=$TG_EC)，调用 opencode 修复"
            local TG_FIX_BUDGET=$(( DEADLINE - $(date +%s) - 900 ))
            if [ "$TG_FIX_BUDGET" -lt 900 ]; then
              echo "[test-gate] 剩余时间不足以安排修复，仅记录失败"
              return 0
            fi
            if [ "$TG_FIX_BUDGET" -gt 2700 ]; then TG_FIX_BUDGET=2700; fi
            {
              echo '本仓库的测试跑不通，请修复。复现方式：在仓库根目录运行 bash /tmp/tg_run.sh。'
              echo
              echo '失败日志（最后 80 行）：'
              tail -80 "$TG_LOG" 2>/dev/null
              echo
              echo '要求：'
              echo '1. 只修复导致测试失败的问题，不得削弱、跳过或删除测试，不得修改门禁脚本让断言失效；'
              echo '2. 不要借修复之名重写无关代码，保持原有功能语义不变；'
              echo '3. .github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；'
              echo '4. 修复后必须自行运行测试并确认完全通过。'
            } > /tmp/tg_fix_prompt.txt
            run_phase "testfix" "$(cat /tmp/tg_fix_prompt.txt)" "$TG_FIX_BUDGET" || true


            timeout --kill-after=30 600 bash /tmp/tg_run.sh > /tmp/test_gate_verify.log 2>&1
            local TG_VEC=$?
            if [ "$TG_VEC" -eq 0 ]; then
              echo "[test-gate] 修复后复跑测试：通过"
            else
              echo "[test-gate] 修复后复跑测试仍未通过 (exit=$TG_VEC)"
            fi

            commit_and_push "$iter-testfix"

            return 0
          }

          # ================= 主循环 =================
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))

            AVAIL_MB=$(( $(df --output=avail / | tail -1) / 1024 ))
            echo "--- iteration #$i | free disk: ${AVAIL_MB}MB ---"
            free -h | head -2
            if [ "$AVAIL_MB" -lt 2048 ]; then
              echo "[error] 磁盘剩余不足 2GB，提前结束循环，交给收尾步骤清理"
              break
            fi

            # ----- 阶段：perf / sci 已停用 → bug -> clean -> apply -----
            # sci（改进科研方法）阶段已移除：该阶段原本会随机挑选一个科研方法提示词
            # 并发起一次 LLM 调用，现按需求彻底去掉，不再进入主循环。
            # clean 阶段保留在主循环：每个迭代执行一次，删除仓库中的多余内容
            # （收尾的 Cleanup repo artifacts 步骤继续兜底清理临时产物）。
            for phase in bug clean apply; do
              case "$phase" in
                perf)  P="$PROMPT_PERF";  T="$PERF_TIMEOUT"  ;;
                bug)   P="$PROMPT_BUG";   T="$BUG_TIMEOUT"   ;;
                clean) P="$PROMPT_CLEAN"; T="$CLEAN_TIMEOUT" ;;
                apply) P="$PROMPT_APPLY"; T="$APPLY_TIMEOUT" ;;
              esac

              # 收窄到剩余时间
              REMAIN=$(( DEADLINE - $(date +%s) ))
              if [ "$REMAIN" -le 0 ]; then
                echo "[info] 全局时间已到，退出循环"
                break 2
              fi
              if [ "$T" -gt "$REMAIN" ]; then T="$REMAIN"; fi

              echo ">>> iteration #$i | phase=$phase | budget=${T}s"
              case "$phase" in
                perf|bug) P="$(fast_prompt "$phase" "$P")" ;;
              esac
              run_phase "$phase" "$P" "$T"

              # 无论成功失败，先把已完成的改动提交上去
              commit_and_push "$i-$phase"

              # ⭐ 概率测试门（新增）：bug 阶段提交后 20% 概率跑测试，详见 maybe_run_tests
              if [ "$phase" = "bug" ]; then
                maybe_run_tests "$i"
              fi

              sleep 5
            done
          done

      - name: Cleanup repo artifacts
        if: always()
        run: |
          set +e
          rm -f .opencode_issues.md
          rm -f opencode.json opencode.jsonc .opencode.json 2>/dev/null
          find . -type f -name 'REPORT*.md'          -not -path './.git/*' -delete
          find . -type f -name 'autodl_budget*.json' -not -path './.git/*' -delete
          if [ -d docs ]; then
            find docs -mindepth 1 -maxdepth 1 ! -name 'design_notes.md' -exec rm -rf {} +
            [ -f docs/design_notes.md ] || : > docs/design_notes.md
          fi

      - name: Final commit and push
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME:-main}"
          REMOTE_BASE="origin/${BRANCH}"
          PUSH_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          timeout 60 git fetch origin "$BRANCH" 2>/dev/null || true
          # ⭐ 保护循环自身：以远程已批准状态为准回滚 AI 对 .github 的改动
          git checkout "$REMOTE_BASE" -- .github 2>/dev/null || git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq .github 2>/dev/null || true
          # 防删自愈：收尾提交前恢复被删的 README.md（优先远程基准）
          if [ ! -f "README.md" ]; then
            if git show "${REMOTE_BASE}:README.md" > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
              mv /tmp/readme_restore.md README.md
            elif git show HEAD:README.md > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
              mv /tmp/readme_restore.md README.md
            else
              README_SHA=$(git log --format=%H --diff-filter=AM -- README.md 2>/dev/null | head -1)
              if [ -n "$README_SHA" ] && git show "${README_SHA}:README.md" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md README.md
              fi
            fi
            [ -f README.md ] && echo "[guard] 收尾阶段发现 README.md 被删，已恢复"
          fi
          # 防删自愈：收尾提交前恢复被删的 docs 设计笔记（compute_plan.md 已废弃，不恢复）
          for f in docs/design_notes.md; do
            if [ ! -f "$f" ]; then
              if git show "${REMOTE_BASE}:$f" > /tmp/docs_restore.md 2>/dev/null && [ -s /tmp/docs_restore.md ]; then
                mv /tmp/docs_restore.md "$f"
              elif git show "HEAD:$f" > /tmp/docs_restore.md 2>/dev/null && [ -s /tmp/docs_restore.md ]; then
                mv /tmp/docs_restore.md "$f"
              else
                F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
                if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/docs_restore2.md 2>/dev/null && [ -s /tmp/docs_restore2.md ]; then
                  mv /tmp/docs_restore2.md "$f"
                fi
              fi
              [ -f "$f" ] && echo "[guard] 收尾阶段发现 $f 被删，已恢复"
            fi
          done
          # compute_plan.md 已废弃删除：任何阶段重新生成的副本都不入库
          rm -f docs/compute_plan.md
          git add -A

          # ⭐ DeepSeek 把关：收尾提交同样必须审查通过才推送（含 agent 本地提交）
          gate_once() {
            if ! git rev-parse --verify --quiet "$REMOTE_BASE" >/dev/null 2>&1; then echo "UNAVAILABLE"; return 0; fi
            if git diff "$REMOTE_BASE" --quiet 2>/dev/null; then echo "APPROVE"; return 0; fi
            python3 .github/scripts/deepseek_gate.py "final cleanup" "$BRANCH" 2>/dev/null || echo "UNAVAILABLE"
          }
          FVERDICT=""
          for ga in 1 2 3; do
            FVERDICT="$(gate_once)"
            case "$FVERDICT" in APPROVE|REJECT:*) break ;; esac
            [ "$ga" -lt 3 ] && { echo "[gate] DeepSeek 把关暂不可用 (attempt $ga)，20s 后重试"; sleep 20; }
          done
          case "$FVERDICT" in
            APPROVE)
              ;;
            REJECT:*)
              echo "[gate] DeepSeek 拦截收尾改动: ${FVERDICT#REJECT:} —— 回滚到远程基准，不推送"
              git reset --hard "$REMOTE_BASE" >/dev/null 2>&1 || true
              git clean -fdq >/dev/null 2>&1 || true
              exit 0
              ;;
            *)
              echo "[gate] DeepSeek 把关不可用，收尾改动不推送（把关优先）"
              git reset >/dev/null 2>&1 || true
              exit 0
              ;;
          esac

          LAST_MODEL="$(head -c 120 /tmp/last_model_used.txt 2>/dev/null || true)"
          git commit -m "auto: end of 5h run, cleanup${LAST_MODEL:+ [model: $LAST_MODEL]}" || echo "nothing to commit"
          git pull --rebase origin "$BRANCH" || git rebase --abort || true
          git push "$PUSH_URL" "HEAD:${BRANCH}" || echo "[warn] final push failed"

      - name: Push to Gitee
        if: always()
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set +e
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "GITEE_TOKEN or GITEE_REPO not set, skipping Gitee push."
            exit 0
          fi
          BRANCH="${GITHUB_REF_NAME:-main}"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "HEAD:${BRANCH}" --force || echo "[warn] push to Gitee failed"
  # ===== loop hand-off (added) =====

  # ⭐ 立刻续跑（下）：独立的收尾 job。
  # needs + if: always()：工作 job 无论成功、失败、超时被取消，这个 job 都会紧接着启动（已实测验证）。
  # 这里无条件派发一个新的后继 run：它在组内排队，本 run 退出的一瞬间就被调度。
  # 万一这个 job 连启动都没机会（整个 run 被强杀），*/5 心跳会兜底。
  next-run:
    needs: [run-opencode]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Ensure next run is queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              echo "[loop] 已派发后继 run（attempt ${attempt}）——本 run 结束后立刻起跑"
              exit 0
            fi
            echo "[loop][warn] 派发失败（attempt ${attempt}）10s 后重试"
            sleep 10
          done
          echo "[loop][warn] 派发失败；下一次 */5 心跳会补位"
          exit 0
