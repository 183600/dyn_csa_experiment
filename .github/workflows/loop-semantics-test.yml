name: loop-semantics-test

on:
  workflow_dispatch:

concurrency:
  group: loop-semantics-test
  cancel-in-progress: false

jobs:
  work-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: fail on purpose
        run: |
          sleep 5
          echo "intentional failure"
          exit 1

  after-fail:
    needs: [work-fail]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: report
        run: echo "RAN-AFTER-FAILURE"

  work-timeout:
    needs: [after-fail]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: hang past the job timeout
        run: sleep 240

  after-timeout:
    needs: [work-timeout]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: report
        run: echo "RAN-AFTER-JOB-TIMEOUT-CANCELLED"
